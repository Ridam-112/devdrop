<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sledge Rider 3D</title>
<style>
:root{--card:rgba(255,255,255,.88);--ct:#10243a;--ac:#d8352a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:rgba(14,26,42,.88);--ct:#eaf3ff}}
html,body{height:100%;margin:0;overflow:hidden;background:#b9d4e8;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#vg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(20,50,90,.55));opacity:.2}
#fl{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#ev{position:fixed;top:64px;left:0;right:0;text-align:center;font-weight:800;font-size:26px;letter-spacing:1px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.55);pointer-events:none}
#avb{position:fixed;left:100px;right:100px;bottom:calc(18px + env(safe-area-inset-bottom,0px));height:10px;border-radius:6px;background:var(--card);overflow:hidden;pointer-events:none;z-index:40;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#avb i{display:block;height:100%;width:100%;background:var(--ac)}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;gap:10px;padding:12px;pointer-events:none;font-weight:700;font-size:18px;z-index:50}
#hud span{background:var(--card);color:var(--ct);padding:6px 12px;border-radius:10px}

/* Mobile & Phone Responsive Touch Controls */
#touch-controls{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:60;user-select:none;-webkit-user-select:none}
.touch-col{display:flex;flex-direction:column;pointer-events:auto}
.touch-col-left{gap:12px;align-items:center}
.touch-col-right{justify-content:flex-end;align-items:center}
.t-btn{background:rgba(16,36,58,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:2.5px solid rgba(255,255,255,.9);border-radius:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;font-family:inherit;font-weight:800;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;box-shadow:0 8px 24px rgba(0,0,0,.4),inset 0 2px 4px rgba(255,255,255,.25);transition:transform .08s ease,filter .08s ease,box-shadow .08s ease}
.t-btn:active,.t-btn.pressed{transform:scale(.91);filter:brightness(1.25);box-shadow:0 3px 10px rgba(0,0,0,.6)}
.t-btn-left,.t-btn-right{width:76px;height:76px;background:linear-gradient(145deg,#1e293b,#0f172a)}
.t-btn-left .t-icon,.t-btn-right .t-icon{font-size:32px;line-height:1;margin-bottom:2px}
.t-btn-left .t-label,.t-btn-right .t-label{font-size:11px;letter-spacing:.5px}

/* JUMP Button: Positioned Directly Above Left Steer */
.t-btn-jump{width:70px;height:70px;background:linear-gradient(135deg,#0284c7,#0369a1);border:2.5px solid #bae6fd;box-shadow:0 8px 22px rgba(2,132,199,.45),inset 0 2px 4px rgba(255,255,255,.35)}
.t-btn-jump .t-icon{font-size:28px;line-height:1;margin-bottom:2px;animation:jumpPulse 2s infinite ease-in-out}
.t-btn-jump .t-label{font-size:11px;letter-spacing:.5px}
@keyframes jumpPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

@media (max-width:600px){
  #touch-controls{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:8px;right:8px}
  .touch-col-left{gap:10px}
  .t-btn-left,.t-btn-right{width:66px;height:66px}
  .t-btn-left .t-icon,.t-btn-right .t-icon{font-size:28px}
  .t-btn-jump{width:60px;height:60px}
  .t-btn-jump .t-icon{font-size:24px}
  #avb{left:84px;right:84px;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  #hud{font-size:14px;padding:8px}
  #hud span{padding:4px 8px}
}

#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;z-index:100}
#box{background:var(--card);color:var(--ct);border-radius:18px;padding:26px 30px;max-width:380px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
h1{margin:0 0 8px;font-size:34px;letter-spacing:-.5px}p{margin:6px 0;line-height:1.45}
button{margin-top:14px;font:inherit;font-weight:700;font-size:18px;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 28px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ct);outline-offset:3px}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="vg"></div><div id="fl"></div><div id="ev"></div><div id="avb"><i></i></div>
<div id="hud"><a href="arcade_hub.html" style="text-decoration:none;pointer-events:auto;cursor:pointer;background:var(--card);color:var(--ct);padding:6px 12px;border-radius:10px;font-weight:700;" title="Back to Arcade Hub">🏠 Hub</a><span id="sc">0 m</span><span id="co">🪙 0</span><span id="sp">0 km/h</span></div>

<div id="touch-controls">

    <button class="t-btn t-btn-jump" id="btnJump" aria-label="Jump Sled">
      <span class="t-icon">⬆</span>
      <span class="t-label">JUMP</span>
    </button>
    <button class="t-btn t-btn-left" id="btnLeft" aria-label="Turn Left">
      <span class="t-icon">◀</span>
      <span class="t-label">LEFT</span>
    </button>
  </div>
  <div class="touch-col touch-col-right">
    <button class="t-btn t-btn-right" id="btnRight" aria-label="Turn Right">
      <span class="t-icon">▶</span>
      <span class="t-label">RIGHT</span>
    </button>
  </div>
</div>

<button id="go">Start ride</button></div></div>
