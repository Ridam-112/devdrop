<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tic-Tac-Toe - Clay Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(135deg, #e4edf8 0%, #d8e5f5 100%);
      font-family: 'Fredoka', cursive, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #2c3e50;
      padding: 12px;
    }
    #game-container {
      position: relative;
      width: 440px;
      max-width: 96vw;
      background: #fbfdff;
      border-radius: 36px;
      box-shadow: 18px 24px 45px rgba(160, 180, 205, 0.45), -12px -12px 35px #ffffff,
                  inset 4px 4px 8px rgba(255, 255, 255, 0.9), inset -4px -4px 8px rgba(160, 180, 205, 0.2);
      padding: 24px 20px;
      border: 4px solid #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .clay-pill {
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 6px 8px 16px rgba(166, 180, 200, 0.45), inset 3px 3px 6px #ffffff, inset -3px -3px 6px rgba(166, 180, 200, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 700;
    }
    /* Mode Toggle */
    .mode-select {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .mode-btn {
      padding: 6px 14px;
      border-radius: 16px;
      background: #f0f4f9;
      border: 2px solid transparent;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      color: #636e72;
      cursor: pointer;
      box-shadow: inset 2px 2px 4px rgba(160, 180, 205, 0.3);
    }
    .mode-btn.active {
      background: #0984e3;
      color: #ffffff;
      box-shadow: 4px 6px 12px rgba(9, 132, 227, 0.35);
    }
    /* 3x3 Board */
    #board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 14px;
      width: 100%;
      aspect-ratio: 1;
      background: #eef2f7;
      border-radius: 28px;
      padding: 14px;
      box-shadow: inset 4px 4px 10px rgba(160, 180, 205, 0.45), inset -4px -4px 10px #ffffff;
      border: 3px solid #ffffff;
    }
    .cell {
      border-radius: 20px;
      background: #fbfdff;
      box-shadow: 6px 8px 16px rgba(160, 180, 205, 0.35), inset 3px 3px 6px #ffffff, inset -3px -3px 6px rgba(160, 180, 205, 0.25);
      border: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .cell:hover { transform: scale(1.04); }
    .cell:active { transform: scale(0.94); }
    .cell.x {
      color: #ff7675;
      text-shadow: 2px 3px 6px rgba(255, 118, 117, 0.4);
    }
    .cell.o {
      color: #00cec9;
      text-shadow: 2px 3px 6px rgba(0, 206, 201, 0.4);
    }
    .cell.win {
      animation: winPulse 0.6s infinite alternate;
      background: #fef9e7;
    }
    @keyframes winPulse {
      from { transform: scale(0.96); }
      to { transform: scale(1.08); }
    }
    /* Modal */
    .screen-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(240, 246, 255, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 20;
      text-align: center;
      border-radius: 36px;
    }
    .screen-modal.hidden { display: none; }
    .clay-card {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 32px;
      box-shadow: 14px 20px 35px rgba(160, 178, 202, 0.4), inset 4px 4px 8px #ffffff;
      border: 3px solid #ffffff;
      width: 100%;
      max-width: 340px;
    }
    .clay-btn {
      background: linear-gradient(135deg, #0984e3 0%, #74b9ff 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 6px 10px 18px rgba(9, 132, 227, 0.35), inset 2px 2px 4px #ffffff;
      cursor: pointer;
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="clay-pill">
        <span id="turn-indicator">Turn: X</span>
      </div>
      <button class="clay-pill" id="btn-sound" style="padding: 8px 12px; cursor: pointer;">🔊</button>
    </div>

    <!-- Mode Selector -->
    <div class="mode-select">
      <button class="mode-btn active" id="mode-ai">🤖 VS AI</button>
      <button class="mode-btn" id="mode-2p">👥 2 PLAYERS</button>
    </div>

    <!-- 3x3 Board -->
    <div id="board">
      <div class="cell" id="c-0"></div>
      <div class="cell" id="c-1"></div>
      <div class="cell" id="c-2"></div>
      <div class="cell" id="c-3"></div>
      <div class="cell" id="c-4"></div>
      <div class="cell" id="c-5"></div>
      <div class="cell" id="c-6"></div>
      <div class="cell" id="c-7"></div>
      <div class="cell" id="c-8"></div>
    </div>

    <!-- Result Modal -->
    <div id="result-modal" class="screen-modal hidden">
      <div class="clay-card">
        <div style="font-size: 50px; margin-bottom: 6px;" id="result-emoji">🎉</div>
        <h1 style="color: #0984e3; font-size: 28px;" id="result-title">X WINS!</h1>
        <p style="color: #636e72; font-size: 15px; margin: 10px 0;" id="result-subtitle">Great match!</p>
        <button id="btn-restart" class="clay-btn">PLAY AGAIN 🔄</button>
      </div>
    </div>
  </div>

  <script>
    class ClaySound {
      constructor() {
        this.ctx = null;
        this.muted = false;
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        } catch (e) {}
      }
      resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
      toggle() { this.muted = !this.muted; return this.muted; }
      plop(isX = true) {
        if (!this.ctx || this.muted) return;
        this.resume();
        const freq = isX ? 440 : 330;
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(freq, this.ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(freq * 0.5, this.ctx.currentTime + 0.08);
        g.gain.setValueAtTime(0.3, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.1);
      }
      win() {
        if (!this.ctx || this.muted) return;
        this.resume();
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = 'triangle';
          o.frequency.value = f;
          g.gain.setValueAtTime(0.25, now + idx * 0.06);
          g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.06 + 0.15);
          o.connect(g); g.connect(this.ctx.destination);
          o.start(now + idx * 0.06); o.stop(now + idx * 0.06 + 0.16);
        });
      }
    }
    const sound = new ClaySound();

    let board = Array(9).fill(null);
    let currentPlayer = 'X';
    let vsAI = true;
    let gameOver = false;

    const WIN_PATTERNS = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    function initGame() {
      board = Array(9).fill(null);
      currentPlayer = 'X';
      gameOver = false;
      document.getElementById('turn-indicator').innerText = 'Turn: X';
      document.getElementById('result-modal').classList.add('hidden');

      for (let i = 0; i < 9; i++) {
        const c = document.getElementById(`c-${i}`);
        c.innerText = '';
        c.className = 'cell';
      }
    }

    function makeMove(idx) {
      if (board[idx] || gameOver) return;

      board[idx] = currentPlayer;
      sound.plop(currentPlayer === 'X');

      const cell = document.getElementById(`c-${idx}`);
      cell.innerText = currentPlayer;
      cell.classList.add(currentPlayer.toLowerCase());

      const winLine = checkWinner(board);
      if (winLine) {
        gameOver = true;
        sound.win();
        winLine.forEach(i => document.getElementById(`c-${i}`).classList.add('win'));
        setTimeout(() => showResult(`${currentPlayer} WINS!`, '🎉'), 600);
        return;
      }

      if (board.every(b => b !== null)) {
        gameOver = true;
        setTimeout(() => showResult('DRAW GAME!', '🤝'), 400);
        return;
      }

      currentPlayer = (currentPlayer === 'X' ? 'O' : 'X');
      document.getElementById('turn-indicator').innerText = `Turn: ${currentPlayer}`;

      if (vsAI && currentPlayer === 'O' && !gameOver) {
        setTimeout(makeAIMove, 350);
      }
    }

    function makeAIMove() {
      // Find winning or blocking move, else random
      let chosenIdx = null;

      // 1. Can AI win?
      for (let i = 0; i < 9; i++) {
        if (!board[i]) {
          board[i] = 'O';
          if (checkWinner(board)) { chosenIdx = i; board[i] = null; break; }
          board[i] = null;
        }
      }

      // 2. Can player win? Block!
      if (chosenIdx === null) {
        for (let i = 0; i < 9; i++) {
          if (!board[i]) {
            board[i] = 'X';
            if (checkWinner(board)) { chosenIdx = i; board[i] = null; break; }
            board[i] = null;
          }
        }
      }

      // 3. Take center
      if (chosenIdx === null && !board[4]) chosenIdx = 4;

      // 4. Random available
      if (chosenIdx === null) {
        const avail = [];
        board.forEach((v, i) => { if (!v) avail.push(i); });
        chosenIdx = avail[Math.floor(Math.random() * avail.length)];
      }

      if (chosenIdx !== null) makeMove(chosenIdx);
    }

    function checkWinner(bd) {
      for (let p of WIN_PATTERNS) {
        if (bd[p[0]] && bd[p[0]] === bd[p[1]] && bd[p[0]] === bd[p[2]]) {
          return p;
        }
      }
      return null;
    }

    function showResult(title, emoji) {
      document.getElementById('result-title').innerText = title;
      document.getElementById('result-emoji').innerText = emoji;
      document.getElementById('result-modal').classList.remove('hidden');
    }

    for (let i = 0; i < 9; i++) {
      document.getElementById(`c-${i}`).addEventListener('click', () => makeMove(i));
    }

    document.getElementById('mode-ai').addEventListener('click', () => {
      vsAI = true;
      document.getElementById('mode-ai').classList.add('active');
      document.getElementById('mode-2p').classList.remove('active');
      initGame();
    });

    document.getElementById('mode-2p').addEventListener('click', () => {
      vsAI = false;
      document.getElementById('mode-2p').classList.add('active');
      document.getElementById('mode-ai').classList.remove('active');
      initGame();
    });

    document.getElementById('btn-restart').addEventListener('click', initGame);
    document.getElementById('btn-sound').addEventListener('click', () => {
      const m = sound.toggle();
      document.getElementById('btn-sound').innerText = m ? '🔇' : '🔊';
    });

    initGame();
  </script>
</body>
</html>
