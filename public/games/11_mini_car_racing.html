<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mini Car Racing - Clay Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(135deg, #e4edf8 0%, #d8e5f5 100%);
      font-family: 'Fredoka', cursive, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #2c3e50;
      padding: 12px;
    }
    #game-container {
      position: relative;
      width: 480px;
      max-width: 96vw;
      height: 720px;
      max-height: 94vh;
      background: #fbfdff;
      border-radius: 36px;
      box-shadow: 18px 24px 45px rgba(160, 180, 205, 0.45), -12px -12px 35px #ffffff,
                  inset 4px 4px 8px rgba(255, 255, 255, 0.9), inset -4px -4px 8px rgba(160, 180, 205, 0.2);
      overflow: hidden;
      border: 4px solid #ffffff;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .clay-pill {
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 6px 8px 16px rgba(166, 180, 200, 0.45), inset 3px 3px 6px #ffffff, inset -3px -3px 6px rgba(166, 180, 200, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 700;
      pointer-events: auto;
    }
    /* Touch Steering Controls */
    .touch-controls {
      position: absolute;
      bottom: 24px;
      left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 24px;
      pointer-events: none;
      z-index: 10;
    }
    .t-btn {
      width: 60px;
      height: 60px;
      border-radius: 22px;
      background: #ffffff;
      box-shadow: 6px 8px 16px rgba(166, 180, 200, 0.45), inset 3px 3px 6px #ffffff, inset -3px -3px 6px rgba(166, 180, 200, 0.3);
      border: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      pointer-events: auto;
      transition: transform 0.1s;
    }
    .t-btn:active { transform: scale(0.92); }
    /* Modal */
    .screen-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(240, 246, 255, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 20;
      text-align: center;
    }
    .screen-modal.hidden { display: none; }
    .clay-card {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 32px;
      box-shadow: 14px 20px 35px rgba(160, 178, 202, 0.4), inset 4px 4px 8px #ffffff;
      border: 3px solid #ffffff;
      width: 100%;
      max-width: 340px;
    }
    .clay-btn {
      background: linear-gradient(135deg, #ff7675 0%, #d63031 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 6px 10px 18px rgba(214, 48, 49, 0.35), inset 2px 2px 4px #ffffff;
      cursor: pointer;
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas" width="480" height="720"></canvas>

    <div class="hud">
      <div class="clay-pill">
        <span>🏁</span>
        <span id="lap-val">Lap 1/3</span>
      </div>
      <div class="clay-pill">
        <span>⏱️</span>
        <span id="time-val">0.0s</span>
      </div>
      <button class="clay-pill" id="btn-sound" style="padding: 8px 12px; cursor: pointer;">🔊</button>
    </div>

    <!-- On-screen controls -->
    <div class="touch-controls">
      <div style="display: flex; gap: 12px;">
        <div class="t-btn" id="btn-left">⬅️</div>
        <div class="t-btn" id="btn-right">➡️</div>
      </div>
      <div style="display: flex; gap: 12px;">
        <div class="t-btn" id="btn-brake">🛑</div>
        <div class="t-btn" id="btn-gas">🚀</div>
      </div>
    </div>

    <!-- Start / Win Screen -->
    <div id="start-screen" class="screen-modal">
      <div class="clay-card">
        <div style="font-size: 52px; margin-bottom: 8px;">🏎️ 💨 🏁</div>
        <h1 style="color: #d63031; font-size: 28px;">Mini Car Racing</h1>
        <p style="color: #636e72; font-size: 15px; margin: 10px 0;">Drive your clay racecar around the track! Complete 3 laps as fast as possible!</p>
        <button id="btn-start" class="clay-btn">START RACE ▶</button>
      </div>
    </div>

    <div id="win-screen" class="screen-modal hidden">
      <div class="clay-card">
        <div style="font-size: 52px; margin-bottom: 8px;">🏆 🥇 🎉</div>
        <h1 style="color: #0984e3; font-size: 28px;">RACE FINISHED!</h1>
        <p style="color: #636e72; font-size: 15px; margin: 10px 0;">Outstanding driving on the clay track!</p>
        <div style="background: #f0f4f9; padding: 12px; border-radius: 18px; margin: 12px 0;">
          <div style="font-size: 24px; font-weight: 700; color: #d63031;" id="final-time">0.0s</div>
          <div style="font-size: 11px; color: #829ab1; text-transform: uppercase;">Total Time</div>
        </div>
        <button id="btn-restart" class="clay-btn">RACE AGAIN 🔄</button>
      </div>
    </div>
  </div>

  <script>
    class ClaySound {
      constructor() {
        this.ctx = null;
        this.muted = false;
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        } catch (e) {}
      }
      resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
      toggle() { this.muted = !this.muted; return this.muted; }
      lap() {
        if (!this.ctx || this.muted) return;
        this.resume();
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99].forEach((f, idx) => {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = 'triangle';
          o.frequency.value = f;
          g.gain.setValueAtTime(0.2, now + idx * 0.06);
          g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.06 + 0.12);
          o.connect(g); g.connect(this.ctx.destination);
          o.start(now + idx * 0.06); o.stop(now + idx * 0.06 + 0.13);
        });
      }
      boost() {
        if (!this.ctx || this.muted) return;
        this.resume();
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(300, this.ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.2);
        g.gain.setValueAtTime(0.3, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.22);
      }
    }
    const sound = new ClaySound();

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = 480;
    const H = 720;

    let gameState = 'START';
    let currentLap = 1;
    const TOTAL_LAPS = 3;
    let startTime = 0;
    let elapsedTime = 0;
    let lastCheckpoint = 0;

    // Car State
    let car = {
      x: 240,
      y: 600,
      angle: -Math.PI / 2,
      speed: 0,
      maxSpeed: 6.5,
      accel: 0.18,
      friction: 0.96,
      steer: 0.055,
      w: 22,
      h: 36
    };

    let keys = {};
    let skidMarks = [];

    // Track Waypoints / Checkpoints
    const CHECKPOINTS = [
      { x: 240, y: 600, r: 50 }, // Finish / Start Line
      { x: 380, y: 480, r: 60 },
      { x: 380, y: 220, r: 60 },
      { x: 240, y: 100, r: 60 },
      { x: 100, y: 220, r: 60 },
      { x: 100, y: 480, r: 60 }
    ];

    function initGame() {
      currentLap = 1;
      lastCheckpoint = 0;
      car.x = 240;
      car.y = 600;
      car.angle = -Math.PI / 2;
      car.speed = 0;
      skidMarks = [];
      startTime = Date.now();
      elapsedTime = 0;
      gameState = 'PLAYING';
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('win-screen').classList.add('hidden');
    }

    // Input handlers
    window.addEventListener('keydown', (e) => { keys[e.key] = true; });
    window.addEventListener('keyup', (e) => { keys[e.key] = false; });

    const btnLeft = document.getElementById('btn-left');
    const btnRight = document.getElementById('btn-right');
    const btnGas = document.getElementById('btn-gas');
    const btnBrake = document.getElementById('btn-brake');

    const bindTouch = (btn, key) => {
      btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
      btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
    };
    bindTouch(btnLeft, 'ArrowLeft');
    bindTouch(btnRight, 'ArrowRight');
    bindTouch(btnGas, 'ArrowUp');
    bindTouch(btnBrake, 'ArrowDown');

    document.getElementById('btn-start').addEventListener('click', initGame);
    document.getElementById('btn-restart').addEventListener('click', initGame);
    document.getElementById('btn-sound').addEventListener('click', () => {
      const m = sound.toggle();
      document.getElementById('btn-sound').innerText = m ? '🔇' : '🔊';
    });

    function drawTrack() {
      // Outer grass
      ctx.fillStyle = '#badc58';
      ctx.fillRect(0, 0, W, H);

      // Track Asphalt (Clay soft curve)
      ctx.strokeStyle = '#636e72';
      ctx.lineWidth = 110;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.beginPath();
      ctx.moveTo(240, 600);
      ctx.bezierCurveTo(440, 600, 440, 100, 240, 100);
      ctx.bezierCurveTo(40, 100, 40, 600, 240, 600);
      ctx.stroke();

      // Track Inset Lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.lineWidth = 4;
      ctx.setLineDash([14, 14]);
      ctx.beginPath();
      ctx.moveTo(240, 600);
      ctx.bezierCurveTo(440, 600, 440, 100, 240, 100);
      ctx.bezierCurveTo(40, 100, 40, 600, 240, 600);
      ctx.stroke();
      ctx.setLineDash([]);

      // Start/Finish Line
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(240, 550);
      ctx.lineTo(240, 650);
      ctx.stroke();

      // Checkered pattern
      ctx.fillStyle = '#d63031';
      ctx.fillRect(236, 560, 8, 16);
      ctx.fillRect(236, 592, 8, 16);
      ctx.fillRect(236, 624, 8, 16);
    }

    function drawCar() {
      ctx.save();
      ctx.translate(car.x, car.y);
      ctx.rotate(car.angle);

      // Drop shadow
      ctx.shadowColor = 'rgba(45, 52, 54, 0.45)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 4;

      // Clay Car Body
      ctx.fillStyle = '#ff7675';
      ctx.beginPath();
      ctx.roundRect(-car.w / 2, -car.h / 2, car.w, car.h, 6);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;

      // Cabin / Windshield
      ctx.fillStyle = '#dfe6e9';
      ctx.beginPath();
      ctx.roundRect(-car.w / 2 + 3, -car.h / 2 + 10, car.w - 6, car.h / 2 - 4, 4);
      ctx.fill();

      // Wheels
      ctx.fillStyle = '#2d3436';
      ctx.fillRect(-car.w / 2 - 2, -car.h / 2 + 4, 3, 8);
      ctx.fillRect(car.w / 2 - 1, -car.h / 2 + 4, 3, 8);
      ctx.fillRect(-car.w / 2 - 2, car.h / 2 - 12, 3, 8);
      ctx.fillRect(car.w / 2 - 1, car.h / 2 - 12, 3, 8);

      // Inset Highlight
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.beginPath();
      ctx.arc(0, -car.h / 2 + 5, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function loop() {
      drawTrack();

      if (gameState === 'PLAYING') {
        elapsedTime = ((Date.now() - startTime) / 1000).toFixed(1);
        document.getElementById('time-val').innerText = `${elapsedTime}s`;
        document.getElementById('lap-val').innerText = `Lap ${currentLap}/${TOTAL_LAPS}`;

        // Controls
        if (keys['ArrowUp'] || keys['w']) car.speed = Math.min(car.maxSpeed, car.speed + car.accel);
        if (keys['ArrowDown'] || keys['s']) car.speed = Math.max(-car.maxSpeed * 0.4, car.speed - car.accel * 1.5);
        if (keys['ArrowLeft'] || keys['a']) car.angle -= car.steer * (car.speed / car.maxSpeed);
        if (keys['ArrowRight'] || keys['d']) car.angle += car.steer * (car.speed / car.maxSpeed);

        car.speed *= car.friction;
        car.x += Math.cos(car.angle) * car.speed;
        car.y += Math.sin(car.angle) * car.speed;

        // Checkpoints navigation
        const nextIdx = (lastCheckpoint + 1) % CHECKPOINTS.length;
        const cp = CHECKPOINTS[nextIdx];
        if (Math.hypot(car.x - cp.x, car.y - cp.y) < cp.r) {
          lastCheckpoint = nextIdx;
          if (lastCheckpoint === 0) {
            // Completed a lap!
            sound.lap();
            if (currentLap < TOTAL_LAPS) {
              currentLap++;
            } else {
              // Race finished
              gameState = 'WIN';
              document.getElementById('final-time').innerText = `${elapsedTime}s`;
              document.getElementById('win-screen').classList.remove('hidden');
            }
          }
        }
      }

      drawCar();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
