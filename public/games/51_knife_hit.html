<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Knife Hit Reflex</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: monospace; }
    body { background: #0b0f19; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; touch-action: manipulation; }
    .game-card { width: 100%; max-width: 400px; background: #131b2e; border: 2px solid #ff336644; border-radius: 20px; padding: 16px; text-align: center; box-shadow: 0 10px 40px rgba(255,51,102,0.15); }
    canvas { background: #070a12; border-radius: 12px; border: 2px solid #243048; display: block; margin: 0 auto; max-width: 100%; height: auto; cursor: pointer; }
    .hud { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; color: #ff3366; font-weight: bold; }
    .info { font-size: 11px; color: #94a3b8; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="game-card">
    <div class="hud">
      <div>STAGE: <span id="stage">1</span></div>
      <div>KNIVES: <span id="knives">7</span></div>
      <div>SCORE: <span id="score">0</span></div>
    </div>
    <canvas id="c" width="360" height="500"></canvas>
    <div class="info">Tap anywhere to fling your knife into the rotating target! Don't hit existing knives!</div>
  </div>
  <script>
    
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playSound(type) {
    try {
      const ctx = getAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      const now = ctx.currentTime;
      if (type === 'click') {
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
      } else if (type === 'pop') {
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'win') {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.15, now + i*0.1);
          g.gain.linearRampToValueAtTime(0.01, now + i*0.1 + 0.2);
          o.start(now + i*0.1); o.stop(now + i*0.1 + 0.25);
        });
      } else if (type === 'hit' || type === 'lose') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(250, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.25);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      } else if (type === 'score' || type === 'coin') {
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1320, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      }
    } catch(e) {}
  }

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let stage = 1;
    let score = 0;
    let targetAngle = 0;
    let rotSpeed = 0.035;
    let embeddedKnives = []; // Angles
    let flyingKnife = null;
    let knivesLeft = 7;
    let state = 'PLAY';

    function initStage(s) {
      stage = s;
      document.getElementById('stage').innerText = stage;
      knivesLeft = 6 + stage;
      document.getElementById('knives').innerText = knivesLeft;
      embeddedKnives = [];
      targetAngle = 0;
      rotSpeed = (Math.random() > 0.5 ? 1 : -1) * (0.03 + stage * 0.005);
      flyingKnife = null;
      state = 'PLAY';
      playSound('pop');
    }
    function throwKnife() {
      if (state !== 'PLAY' || flyingKnife || knivesLeft <= 0) return;
      flyingKnife = { y: 440, speed: 22 };
      knivesLeft--;
      document.getElementById('knives').innerText = knivesLeft;
      playSound('click');
    }
    window.addEventListener('pointerdown', (e) => {
      if (state === 'DEAD') {
        score = 0;
        document.getElementById('score').innerText = '0';
        initStage(1);
      } else {
        throwKnife();
      }
    });

    function update() {
      if (state !== 'PLAY') return;
      targetAngle += rotSpeed;
      // Irregular rotation speed change
      if (Math.random() < 0.015) {
        rotSpeed = (Math.random() > 0.5 ? 1 : -1) * (0.02 + Math.random() * 0.04);
      }

      if (flyingKnife) {
        flyingKnife.y -= flyingKnife.speed;
        if (flyingKnife.y <= 210) { // Hit the target!
          // Calculate relative hit angle
          let hitAngle = (Math.PI / 2 - targetAngle) % (Math.PI * 2);
          if (hitAngle < 0) hitAngle += Math.PI * 2;

          // Check collision with already embedded knives
          let collision = false;
          for (const angle of embeddedKnives) {
            let diff = Math.abs(angle - hitAngle);
            if (diff > Math.PI) diff = Math.PI * 2 - diff;
            if (diff < 0.22) { collision = true; break; }
          }

          if (collision) {
            state = 'DEAD';
            playSound('hit');
          } else {
            embeddedKnives.push(hitAngle);
            score++;
            document.getElementById('score').innerText = score;
            flyingKnife = null;
            playSound('score');

            if (knivesLeft === 0) {
              playSound('win');
              setTimeout(() => initStage(stage + 1), 600);
            }
          }
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, 360, 500);
      const cx = 180, cy = 150, radius = 60;

      // Draw Rotating Log Target
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(targetAngle);
      ctx.fillStyle = '#78350f';
      ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 4; ctx.strokeStyle = '#b45309'; ctx.stroke();
      // Wood ring pattern
      ctx.beginPath(); ctx.arc(0, 0, radius * 0.6, 0, Math.PI * 2); ctx.strokeStyle = '#92400e'; ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, radius * 0.25, 0, Math.PI * 2); ctx.stroke();

      // Draw embedded knives
      embeddedKnives.forEach(a => {
        ctx.save();
        ctx.rotate(a);
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(-3, radius, 6, 40);
        ctx.fillStyle = '#ff3366';
        ctx.fillRect(-5, radius + 40, 10, 18);
        ctx.restore();
      });
      ctx.restore();

      // Draw active ready knife at bottom
      if (knivesLeft > 0 && !flyingKnife && state === 'PLAY') {
        drawKnife(180, 440);
      }
      if (flyingKnife) {
        drawKnife(180, flyingKnife.y);
      }

      if (state === 'DEAD') {
        ctx.fillStyle = '#ff3366';
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('KNIFE CLASH! GAME OVER', 180, 320);
        ctx.font = '14px monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText('Tap to Try Again', 180, 350);
      }
    }
    function drawKnife(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = '#f1f5f9';
      ctx.beginPath();
      ctx.moveTo(0, -35); ctx.lineTo(5, -20); ctx.lineTo(4, 15); ctx.lineTo(-4, 15); ctx.lineTo(-5, -20);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ff3366';
      ctx.fillRect(-6, 15, 12, 22);
      ctx.restore();
    }
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    initStage(1);
    loop();
  </script>
</body>
</html>
