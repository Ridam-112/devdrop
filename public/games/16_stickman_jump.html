<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stickman Jump - Clay Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(135deg, #e4edf8 0%, #d8e5f5 100%);
      font-family: 'Fredoka', cursive, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #2c3e50;
      padding: 12px;
    }
    #game-container {
      position: relative;
      width: 440px;
      max-width: 96vw;
      height: 720px;
      max-height: 94vh;
      background: #fbfdff;
      border-radius: 36px;
      box-shadow: 18px 24px 45px rgba(160, 180, 205, 0.45), -12px -12px 35px #ffffff,
                  inset 4px 4px 8px rgba(255, 255, 255, 0.9), inset -4px -4px 8px rgba(160, 180, 205, 0.2);
      overflow: hidden;
      border: 4px solid #ffffff;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .clay-pill {
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 6px 8px 16px rgba(166, 180, 200, 0.45), inset 3px 3px 6px #ffffff, inset -3px -3px 6px rgba(166, 180, 200, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 700;
      pointer-events: auto;
    }
    .screen-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(240, 246, 255, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 20;
      text-align: center;
    }
    .screen-modal.hidden { display: none; }
    .clay-card {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 32px;
      box-shadow: 14px 20px 35px rgba(160, 178, 202, 0.4), inset 4px 4px 8px #ffffff;
      border: 3px solid #ffffff;
      width: 100%;
      max-width: 340px;
    }
    .clay-btn {
      background: linear-gradient(135deg, #0984e3 0%, #74b9ff 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 6px 10px 18px rgba(9, 132, 227, 0.35), inset 2px 2px 4px #ffffff;
      cursor: pointer;
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas" width="440" height="720"></canvas>

    <div class="hud">
      <div class="clay-pill">
        <span>⭐</span>
        <span id="score-val">0</span>
      </div>
      <button class="clay-pill" id="btn-sound" style="padding: 8px 12px; cursor: pointer;">🔊</button>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen-modal">
      <div class="clay-card">
        <div style="font-size: 52px; margin-bottom: 8px;">🧗 🦘 ☁️</div>
        <h1 style="color: #0984e3; font-size: 28px;">Stickman Jump</h1>
        <p style="color: #636e72; font-size: 15px; margin: 10px 0;">Bounce on clay platforms to reach the highest clouds! Move with mouse or touch!</p>
        <button id="btn-start" class="clay-btn">JUMP IN ▶</button>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen-modal hidden">
      <div class="clay-card">
        <div style="font-size: 48px; margin-bottom: 6px;">💥 ☁️</div>
        <h1 style="color: #ff5252; font-size: 28px;">FELL OFF!</h1>
        <p style="color: #636e72; font-size: 14px; margin-bottom: 16px;">You missed the clay platform!</p>
        <div style="background: #f0f4f9; padding: 12px; border-radius: 18px; margin-bottom: 16px;">
          <div style="font-size: 24px; font-weight: 700; color: #0984e3;" id="final-score">0</div>
          <div style="font-size: 11px; color: #829ab1; text-transform: uppercase;">Height Reached</div>
        </div>
        <button id="btn-restart" class="clay-btn">PLAY AGAIN 🔄</button>
      </div>
    </div>
  </div>

  <script>
    class ClaySound {
      constructor() {
        this.ctx = null;
        this.muted = false;
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        } catch (e) {}
      }
      resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
      toggle() { this.muted = !this.muted; return this.muted; }
      boing() {
        if (!this.ctx || this.muted) return;
        this.resume();
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(260, this.ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(580, this.ctx.currentTime + 0.12);
        g.gain.setValueAtTime(0.3, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.14);
      }
      spring() {
        if (!this.ctx || this.muted) return;
        this.resume();
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(340, this.ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.2);
        g.gain.setValueAtTime(0.35, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.22);
      }
      fall() {
        if (!this.ctx || this.muted) return;
        this.resume();
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(300, this.ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.35);
        g.gain.setValueAtTime(0.3, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.38);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.38);
      }
    }
    const sound = new ClaySound();

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = 440;
    const H = 720;

    let gameState = 'START';
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('clay_jump_best') || '0', 10);

    let player = {
      x: W / 2,
      y: H - 150,
      vx: 0,
      vy: 0,
      r: 16
    };

    let platforms = [];

    function initGame() {
      score = 0;
      player = {
        x: W / 2,
        y: H - 160,
        vx: 0,
        vy: -11,
        r: 16
      };
      platforms = [];

      // Initial base platforms
      platforms.push({ x: W / 2 - 40, y: H - 80, w: 80, h: 16, type: 'normal' });
      for (let i = 1; i < 8; i++) {
        platforms.push({
          x: 20 + Math.random() * (W - 100),
          y: H - 80 - i * 90,
          w: 70 + Math.random() * 20,
          h: 16,
          type: Math.random() < 0.2 ? 'spring' : 'normal',
          vx: Math.random() < 0.25 ? 1.5 : 0
        });
      }

      gameState = 'PLAYING';
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('gameover-screen').classList.add('hidden');
    }

    // Touch / Mouse follow
    function setTargetX(clientX) {
      const rect = canvas.getBoundingClientRect();
      const clickX = (clientX - rect.left) * (W / rect.width);
      player.vx = (clickX - player.x) * 0.15;
    }
    window.addEventListener('mousemove', (e) => { if (gameState === 'PLAYING') setTargetX(e.clientX); });
    window.addEventListener('touchmove', (e) => {
      if (gameState === 'PLAYING' && e.touches[0]) setTargetX(e.touches[0].clientX);
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') player.vx = -5;
      if (e.key === 'ArrowRight' || e.key === 'd') player.vx = 5;
    });

    document.getElementById('btn-start').addEventListener('click', initGame);
    document.getElementById('btn-restart').addEventListener('click', initGame);
    document.getElementById('btn-sound').addEventListener('click', () => {
      const m = sound.toggle();
      document.getElementById('btn-sound').innerText = m ? '🔇' : '🔊';
    });

    function loop() {
      ctx.fillStyle = '#fbfdff';
      ctx.fillRect(0, 0, W, H);

      if (gameState === 'PLAYING') {
        player.vy += 0.38; // gravity
        player.x += player.vx;
        player.y += player.vy;
        player.vx *= 0.92;

        // Screen wrap
        if (player.x < -10) player.x = W + 10;
        if (player.x > W + 10) player.x = -10;

        // Camera follow upward
        if (player.y < H * 0.45) {
          const diff = H * 0.45 - player.y;
          player.y = H * 0.45;
          score += Math.floor(diff);
          document.getElementById('score-val').innerText = score;

          platforms.forEach(p => p.y += diff);
        }

        // Platform bounce collision
        if (player.vy > 0) {
          platforms.forEach(p => {
            if (player.x + player.r > p.x && player.x - player.r < p.x + p.w &&
                player.y + player.r >= p.y && player.y + player.r <= p.y + 14) {
              if (p.type === 'spring') {
                player.vy = -17;
                sound.spring();
              } else {
                player.vy = -11.5;
                sound.boing();
              }
            }
          });
        }

        // Recycle / spawn platforms
        for (let i = platforms.length - 1; i >= 0; i--) {
          const p = platforms[i];
          if (p.vx) {
            p.x += p.vx;
            if (p.x < 10 || p.x + p.w > W - 10) p.vx *= -1;
          }

          if (p.y > H + 20) {
            platforms.splice(i, 1);
            // Spawn highest platform
            const highestY = Math.min(...platforms.map(pl => pl.y));
            platforms.push({
              x: 20 + Math.random() * (W - 100),
              y: highestY - (75 + Math.random() * 30),
              w: 65 + Math.random() * 20,
              h: 16,
              type: Math.random() < 0.2 ? 'spring' : 'normal',
              vx: Math.random() < 0.3 ? 1.5 : 0
            });
          }
        }

        // Fall death
        if (player.y > H + 40) {
          sound.fall();
          gameState = 'GAMEOVER';
          document.getElementById('final-score').innerText = score;
          document.getElementById('gameover-screen').classList.remove('hidden');
        }
      }

      // Draw Clay Platforms
      platforms.forEach(p => {
        ctx.save();
        ctx.shadowColor = 'rgba(160, 180, 205, 0.4)';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 4;
        ctx.fillStyle = p.type === 'spring' ? '#feca57' : '#1dd1a1';
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.w, p.h, 8);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Platform Highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
        ctx.beginPath();
        ctx.roundRect(p.x + 2, p.y + 2, p.w - 4, p.h / 2, 4);
        ctx.fill();

        if (p.type === 'spring') {
          ctx.fillStyle = '#ff6b6b';
          ctx.beginPath();
          ctx.roundRect(p.x + p.w / 2 - 8, p.y - 8, 16, 8, 3);
          ctx.fill();
        }
        ctx.restore();
      });

      // Draw Clay Stickman Jumper
      ctx.save();
      ctx.translate(player.x, player.y);

      // Body (Cute blue clay blob)
      ctx.shadowColor = 'rgba(9, 132, 227, 0.4)';
      ctx.shadowBlur = 10;
      ctx.fillStyle = '#0984e3';
      ctx.beginPath();
      ctx.arc(0, 0, player.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Cute Eyes
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(-5, -3, 4, 0, Math.PI * 2);
      ctx.arc(5, -3, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#2d3436';
      ctx.beginPath();
      ctx.arc(-5 + (player.vx > 0 ? 1 : -1), -3, 2, 0, Math.PI * 2);
      ctx.arc(5 + (player.vx > 0 ? 1 : -1), -3, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
