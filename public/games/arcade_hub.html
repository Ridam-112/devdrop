<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claymorphism Arcade Hub - 46 Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --clay-bg: #e8f0fe;
      --clay-surface: #ffffff;
      --clay-shadow: 10px 14px 28px rgba(160, 180, 205, 0.4), -6px -6px 20px #ffffff;
      --clay-inset: inset 3px 3px 6px rgba(255, 255, 255, 0.8), inset -3px -3px 6px rgba(160, 180, 205, 0.25);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: linear-gradient(135deg, #e4edf8 0%, #d8e5f5 100%);
      font-family: 'Fredoka', cursive, sans-serif;
      min-height: 100vh;
      color: #2c3e50;
      padding: 32px 18px 60px;
    }
    .container {
      max-width: 1140px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    .badge {
      display: inline-block;
      background: #ffffff;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      color: #0984e3;
      box-shadow: 6px 8px 16px rgba(160, 180, 205, 0.4), var(--clay-inset);
      border: 2px solid #ffffff;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 40px;
      font-weight: 700;
      color: #2d3436;
      margin-bottom: 8px;
    }
    p.sub {
      color: #636e72;
      font-size: 16px;
    }
    /* Filter Bar */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .filter-btn {
      background: #ffffff;
      border: 2px solid #ffffff;
      padding: 10px 22px;
      border-radius: 24px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      color: #636e72;
      box-shadow: 6px 8px 16px rgba(160, 180, 205, 0.35), var(--clay-inset);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .filter-btn:hover {
      transform: translateY(-2px);
    }
    .filter-btn.active {
      background: linear-gradient(135deg, #0984e3 0%, #74b9ff 100%);
      color: #ffffff;
      box-shadow: 6px 10px 18px rgba(9, 132, 227, 0.35);
    }
    /* Games Grid */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 22px;
    }
    .game-card {
      background: #ffffff;
      border-radius: 28px;
      padding: 22px;
      border: 3px solid #ffffff;
      box-shadow: 12px 16px 30px rgba(160, 180, 205, 0.38), -8px -8px 20px #ffffff, var(--clay-inset);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
    }
    .game-card:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 16px 22px 35px rgba(160, 180, 205, 0.5), -10px -10px 25px #ffffff;
    }
    .card-icon {
      width: 72px;
      height: 72px;
      border-radius: 24px;
      background: #eef2f7;
      box-shadow: inset 3px 3px 6px rgba(160, 180, 205, 0.4), inset -3px -3px 6px #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 14px;
    }
    .card-cat {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #0984e3;
      margin-bottom: 4px;
    }
    .card-title {
      font-size: 19px;
      font-weight: 700;
      color: #2d3436;
      margin-bottom: 6px;
    }
    .card-desc {
      font-size: 13px;
      color: #636e72;
      line-height: 1.4;
      margin-bottom: 16px;
      flex: 1;
    }
    .play-link {
      background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 24px;
      border-radius: 20px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 4px 6px 14px rgba(0, 184, 148, 0.35), inset 2px 2px 4px #ffffff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .play-link:hover {
      transform: scale(1.05);
      box-shadow: 6px 8px 18px rgba(0, 184, 148, 0.5);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge">🎨 Claymorphism Game Collection</div>
      <h1>Clay Arcade Hub</h1>
      <p class="sub">46 Standalone HTML5 Games with tactile 3D clay visuals and procedural audio</p>
    </header>

    <div class="filter-bar">
      <button class="filter-btn active" data-cat="all">🎮 All Games (46)</button>
      <button class="filter-btn" data-cat="arcade">💥 Arcade & Reflex</button>
      <button class="filter-btn" data-cat="puzzle">🧩 Puzzle & Brain</button>
      <button class="filter-btn" data-cat="sports">🏎️ Racing & Sports</button>
      <button class="filter-btn" data-cat="casual">🎲 Casual & Platform</button>
    </div>

    <div class="games-grid" id="games-grid"></div>
  </div>

  <script>

      // Arcade

      { id: '24', title: 'Tic-Tac-Toe', cat: 'casual', file: '24_tic_tac_toe.html', icon: '❌', desc: 'Classic 3x3 clay board game vs smart AI or 2-player pass & play local!' },
      { id: '25', title: 'SkyRoad Rush 3D', cat: 'sports', file: '25_skyroad_rush_3d.html', icon: '🚀', desc: 'Hypersonic 3D racer! Weave through traffic, leap hurdles, hit boost pads and take flight!' },
      { id: '26', title: 'Car Parking 3D', cat: 'sports', file: '26_car_parking_3d.html', icon: '🅿️', desc: 'Precision 3D car parking simulator! Maneuver into bays, listen to proximity radar, and avoid collisions!' },

      { id: '28', title: 'Zombie Survival 3D', cat: 'arcade', file: '28_zombie_survival_3d.html', icon: '🧟', desc: 'Survive endless waves of zombies! Collect weapons, medkits, ammo crates and fight brutal boss tanks!' },
      { id: '29', title: 'Football Penalty Master', cat: 'sports', file: '29_football_penalty_freekick_3d.html', icon: '⚽', desc: '3D Penalty & Free Kick simulator! Swipe to curve shots past the wall and beat goalkeeper AI!' },

      { id: '31', title: 'Cyber Shooting Arena', cat: 'arcade', file: '31_shooting_arena_3d.html', icon: '🤖', desc: 'High-octane 3D bot deathmatch! Out-strafe tactical enemy AI bots with Blasters, Plasma & Railguns!' },

      { id: '38', title: 'Tug of War 2D', cat: 'arcade', file: '38_tug_of_war_2d.html', icon: '💪', desc: 'Epic Claymorphic Tug of War! Pull the braided rope, unleash Heave-Ho power surges, and drag the opponent into the mud pit!' },

      { id: '42', title: 'No Brakes Desi Bus Driver 3D', cat: 'arcade', file: '42_no_brakes_desi_bus_driver_3d.html', icon: '🚌', desc: 'Unstoppable runaway Indian bus mayhem! Foot brakes are dead — 2-wheel handbrake drifts, smashing fruit thelas, toll gates, and honking musical air horns to trigger Bollywood Chaos Mode!' },
      { id: '43', title: 'Local Train Door Jammer 3D', cat: 'arcade', file: '43_local_train_door_jammer_3d.html', icon: '🚆', desc: 'Peak office hour suburban train madness! Hang from the footboard, duck under electric poles, push off chaiwalas, elbow pushing crowds, and survive the 3-second stampede at Howrah/Sealdah!' },
      { id: '44', title: 'Election Mayhem: Voting Battle', cat: 'arcade', file: '44_election_mayhem_voting_battle.html', icon: '🗳️', desc: 'Modi, Didi, Rahul, Kejriwal, Lalu, Tharoor, Yogi & Nitish election clash! 7 state crises (highways, hospitals, kisan, power, flood, TET teachers, 5G smart city), twisted bureaucratic dilemmas, newspaper headlines, Arnab TV debates with meme soundboard & EVM vote counting!' },
      { id: '45', title: 'Parliament Kaand 3D', cat: 'arcade', file: '45_parliament_kaand_3d.html', icon: '🏛️', desc: '3D Indian Parliament comedy chaos simulator! Semicircular legislative chamber, Speaker dais, flying paper aeroplanes, wooden desk thumping, decorum vs chaos meter, and ragdoll MPs!' },
      { id: '46', title: 'Sledge Rider 3D', cat: 'sports', file: '46_sledge_rider_3d.html', icon: '🛷', desc: 'Extreme downhill snow sledding! Carve through snowy mountain slopes, jump high off wooden ramps, dodge pine trees & rocks, collect coins, and perform epic airtime!' }
    ];

    const gridEl = document.getElementById('games-grid');

    function renderGames(filter = 'all') {
      gridEl.innerHTML = '';
      const list = filter === 'all' ? GAMES : GAMES.filter(g => g.cat === filter);

      list.forEach(g => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `
          <div class="card-icon">${g.icon}</div>
          <div class="card-cat">${g.cat}</div>
          <div class="card-title">${g.id}. ${g.title}</div>
          <div class="card-desc">${g.desc}</div>
          <a class="play-link" href="${g.file}" target="_blank">PLAY NOW ▶</a>
        `;
        gridEl.appendChild(card);
      });
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGames(btn.dataset.cat);
      });
    });

    renderGames();
  </script>
</body>
</html>
