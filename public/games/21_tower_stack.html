<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tower Stack - Clay Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(135deg, #e4edf8 0%, #d8e5f5 100%);
      font-family: 'Fredoka', cursive, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #2c3e50;
      padding: 12px;
    }
    #game-container {
      position: relative;
      width: 480px;
      max-width: 96vw;
      height: 720px;
      max-height: 94vh;
      background: #fbfdff;
      border-radius: 36px;
      box-shadow: 18px 24px 45px rgba(160, 180, 205, 0.45), -12px -12px 35px #ffffff,
                  inset 4px 4px 8px rgba(255, 255, 255, 0.9), inset -4px -4px 8px rgba(160, 180, 205, 0.2);
      overflow: hidden;
      border: 4px solid #ffffff;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .clay-pill {
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 6px 8px 16px rgba(166, 180, 200, 0.45), inset 3px 3px 6px #ffffff, inset -3px -3px 6px rgba(166, 180, 200, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 700;
      pointer-events: auto;
    }
    .screen-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(240, 246, 255, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 20;
      text-align: center;
    }
    .screen-modal.hidden { display: none; }
    .clay-card {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 32px;
      box-shadow: 14px 20px 35px rgba(160, 178, 202, 0.4), inset 4px 4px 8px #ffffff;
      border: 3px solid #ffffff;
      width: 100%;
      max-width: 340px;
    }
    .clay-btn {
      background: linear-gradient(135deg, #0984e3 0%, #74b9ff 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 6px 10px 18px rgba(9, 132, 227, 0.35), inset 2px 2px 4px #ffffff;
      cursor: pointer;
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas" width="480" height="720"></canvas>

    <div class="hud">
      <div class="clay-pill">
        <span>🏢</span>
        <span id="score-val">0</span>
      </div>
      <button class="clay-pill" id="btn-sound" style="padding: 8px 12px; cursor: pointer;">🔊</button>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen-modal">
      <div class="clay-card">
        <div style="font-size: 52px; margin-bottom: 8px;">🏢 🧱 ✨</div>
        <h1 style="color: #0984e3; font-size: 28px;">Tower Stack</h1>
        <p style="color: #636e72; font-size: 15px; margin: 10px 0;">Tap to stack moving clay blocks! Perfect placements trigger harmonic musical chords!</p>
        <button id="btn-start" class="clay-btn">START STACKING ▶</button>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen-modal hidden">
      <div class="clay-card">
        <div style="font-size: 48px; margin-bottom: 6px;">💥 🏢</div>
        <h1 style="color: #ff5252; font-size: 28px;">TOWER COLLAPSED!</h1>
        <p style="color: #636e72; font-size: 14px; margin-bottom: 16px;">The block completely missed the tower!</p>
        <div style="background: #f0f4f9; padding: 12px; border-radius: 18px; margin-bottom: 16px;">
          <div style="font-size: 26px; font-weight: 700; color: #0984e3;" id="final-score">0</div>
          <div style="font-size: 11px; color: #829ab1; text-transform: uppercase;">Tower Height</div>
        </div>
        <button id="btn-restart" class="clay-btn">STACK AGAIN 🔄</button>
      </div>
    </div>
  </div>

  <script>
    class ClaySound {
      constructor() {
        this.ctx = null;
        this.muted = false;
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        } catch (e) {}
      }
      resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
      toggle() { this.muted = !this.muted; return this.muted; }
      hit(note = 0) {
        if (!this.ctx || this.muted) return;
        this.resume();
        const baseNotes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
        const freq = baseNotes[note % baseNotes.length];
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(freq, this.ctx.currentTime);
        g.gain.setValueAtTime(0.3, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.22);
      }
      fall() {
        if (!this.ctx || this.muted) return;
        this.resume();
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(140, this.ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
        g.gain.setValueAtTime(0.4, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.35);
      }
    }
    const sound = new ClaySound();

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = 480;
    const H = 720;

    const BLOCK_H = 34;
    let stack = [];
    let currentBlock = null;
    let fallingSlices = [];
    let combo = 0;
    let cameraY = 0;
    let gameState = 'START';

    const PASTEL_COLORS = [
      '#ff7675', '#fdcb6e', '#55efc4', '#00cec9', '#74b9ff',
      '#0984e3', '#a29bfe', '#6c5ce7', '#fd79a8', '#e84393'
    ];

    function initGame() {
      stack = [];
      fallingSlices = [];
      combo = 0;
      cameraY = 0;

      // Base block
      stack.push({
        x: W / 2 - 100,
        y: H - 120,
        w: 200,
        color: PASTEL_COLORS[0]
      });

      spawnNextBlock();

      gameState = 'PLAYING';
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('gameover-screen').classList.add('hidden');
      document.getElementById('score-val').innerText = '0';
    }

    function spawnNextBlock() {
      const prev = stack[stack.length - 1];
      const color = PASTEL_COLORS[stack.length % PASTEL_COLORS.length];
      currentBlock = {
        x: 20,
        y: prev.y - BLOCK_H,
        w: prev.w,
        color,
        vx: 4.5 + Math.min(stack.length * 0.1, 5)
      };
    }

    function placeBlock() {
      if (gameState !== 'PLAYING' || !currentBlock) return;

      const prev = stack[stack.length - 1];
      const diff = currentBlock.x - prev.x;

      if (Math.abs(diff) < 5) {
        // Perfect placement!
        currentBlock.x = prev.x;
        combo++;
        sound.hit(combo);
      } else if (diff > 0 && diff < prev.w) {
        // Overhang to right
        const sliceW = diff;
        currentBlock.w = prev.w - diff;
        fallingSlices.push({
          x: currentBlock.x + currentBlock.w,
          y: currentBlock.y,
          w: sliceW,
          vy: 2,
          color: currentBlock.color
        });
        combo = 0;
        sound.hit(stack.length);
      } else if (diff < 0 && -diff < prev.w) {
        // Overhang to left
        const sliceW = -diff;
        currentBlock.w = prev.w + diff;
        const sliceX = currentBlock.x;
        currentBlock.x = prev.x;
        fallingSlices.push({
          x: sliceX,
          y: currentBlock.y,
          w: sliceW,
          vy: 2,
          color: currentBlock.color
        });
        combo = 0;
        sound.hit(stack.length);
      } else {
        // Complete Miss!
        sound.fall();
        gameState = 'GAMEOVER';
        document.getElementById('final-score').innerText = stack.length - 1;
        document.getElementById('gameover-screen').classList.remove('hidden');
        return;
      }

      stack.push(currentBlock);
      document.getElementById('score-val').innerText = stack.length - 1;
      spawnNextBlock();
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      if (gameState === 'PLAYING') placeBlock();
      else if (gameState === 'START') initGame();
    });

    document.getElementById('btn-start').addEventListener('click', initGame);
    document.getElementById('btn-restart').addEventListener('click', initGame);
    document.getElementById('btn-sound').addEventListener('click', () => {
      const m = sound.toggle();
      document.getElementById('btn-sound').innerText = m ? '🔇' : '🔊';
    });

    function drawClayBlock(x, y, w, h, color) {
      ctx.save();
      ctx.shadowColor = 'rgba(160, 180, 205, 0.4)';
      ctx.shadowBlur = 10;
      ctx.shadowOffsetY = 6;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 10);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Inset Highlight
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.beginPath();
      ctx.roundRect(x + 3, y + 3, w - 6, h / 2.5, 5);
      ctx.fill();
      ctx.restore();
    }

    function loop() {
      ctx.fillStyle = '#fbfdff';
      ctx.fillRect(0, 0, W, H);

      // Camera smooth upward scroll
      const targetCamY = Math.max(0, (stack.length - 5) * BLOCK_H);
      cameraY += (targetCamY - cameraY) * 0.1;

      ctx.save();
      ctx.translate(0, cameraY);

      // Draw Stack Blocks
      stack.forEach(b => drawClayBlock(b.x, b.y, b.w, BLOCK_H, b.color));

      // Draw & Update Falling Slices
      for (let i = fallingSlices.length - 1; i >= 0; i--) {
        const s = fallingSlices[i];
        s.y += s.vy;
        s.vy += 0.4;
        drawClayBlock(s.x, s.y, s.w, BLOCK_H, s.color);
        if (s.y > H + cameraY + 100) fallingSlices.splice(i, 1);
      }

      // Update & Draw Moving Block
      if (currentBlock && gameState === 'PLAYING') {
        currentBlock.x += currentBlock.vx;
        if (currentBlock.x < 10 || currentBlock.x + currentBlock.w > W - 10) {
          currentBlock.vx *= -1;
        }
        drawClayBlock(currentBlock.x, currentBlock.y, currentBlock.w, BLOCK_H, currentBlock.color);
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
