<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Wings Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: monospace; }
    body { background: #080d1a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; touch-action: manipulation; }
    .game-card { width: 100%; max-width: 420px; background: #0e1726; border: 2px solid #00ffcc44; border-radius: 20px; padding: 14px; text-align: center; box-shadow: 0 10px 40px rgba(0,255,204,0.1); }
    canvas { background: #050a14; border-radius: 12px; border: 2px solid #1e293b; display: block; margin: 0 auto; max-width: 100%; height: auto; cursor: pointer; }
    .hud { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: #00ffcc; }
    .info { font-size: 11px; color: #64748b; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="game-card">
    <div class="hud">
      <div>SCORE: <span id="score">0</span></div>
      <div>BEST: <span id="best">0</span></div>
    </div>
    <canvas id="c" width="360" height="520"></canvas>
    <div class="info">Tap or Press Space to Flap your Cyber Wings!</div>
  </div>
  <script>
    
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playSound(type) {
    try {
      const ctx = getAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      const now = ctx.currentTime;
      if (type === 'click') {
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
        osc.start(now); osc.stop(now + 0.05);
      } else if (type === 'pop') {
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'win') {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.15, now + i*0.1);
          g.gain.linearRampToValueAtTime(0.01, now + i*0.1 + 0.2);
          o.start(now + i*0.1); o.stop(now + i*0.1 + 0.25);
        });
      } else if (type === 'hit' || type === 'lose') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(250, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.25);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      } else if (type === 'score' || type === 'coin') {
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1320, now + 0.08);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      }
    } catch(e) {}
  }

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let bird = { x: 80, y: 240, vy: 0, r: 16 };
    let pipes = [];
    let score = 0;
    let best = parseInt(localStorage.getItem('flappy_best') || '0');
    document.getElementById('best').innerText = best;
    let state = 'START'; // START, PLAY, DEAD
    let frame = 0;

    function reset() {
      bird = { x: 80, y: 240, vy: 0, r: 16 };
      pipes = [];
      score = 0;
      frame = 0;
      document.getElementById('score').innerText = '0';
      state = 'PLAY';
      playSound('pop');
    }
    function flap() {
      if (state === 'START' || state === 'DEAD') {
        reset();
      } else {
        bird.vy = -7.5;
        playSound('click');
      }
    }
    window.addEventListener('pointerdown', flap);
    window.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); flap(); } });

    function update() {
      if (state !== 'PLAY') return;
      frame++;
      bird.vy += 0.38; // gravity
      bird.y += bird.vy;

      if (bird.y + bird.r > 520 || bird.y - bird.r < 0) {
        die();
      }

      if (frame % 85 === 0) {
        const gap = 125;
        const topH = 60 + Math.random() * (520 - gap - 120);
        pipes.push({ x: 360, top: topH, bottom: topH + gap, passed: false });
      }

      pipes.forEach(p => {
        p.x -= 2.6;
        // Collision check
        if (bird.x + bird.r > p.x && bird.x - bird.r < p.x + 50) {
          if (bird.y - bird.r < p.top || bird.y + bird.r > p.bottom) {
            die();
          }
        }
        if (!p.passed && p.x + 50 < bird.x) {
          p.passed = true;
          score++;
          document.getElementById('score').innerText = score;
          if (score > best) {
            best = score;
            localStorage.setItem('flappy_best', best);
            document.getElementById('best').innerText = best;
          }
          playSound('score');
        }
      });
      pipes = pipes.filter(p => p.x > -60);
    }
    function die() {
      state = 'DEAD';
      playSound('hit');
    }

    function draw() {
      ctx.clearRect(0, 0, 360, 520);
      // Cyber Grid background
      ctx.strokeStyle = '#00ffcc11';
      ctx.lineWidth = 1;
      for (let x = 0; x < 360; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 520); ctx.stroke(); }
      for (let y = 0; y < 520; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(360, y); ctx.stroke(); }

      // Draw pipes
      pipes.forEach(p => {
        ctx.fillStyle = '#10b981';
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 2;
        // Top pipe
        ctx.fillRect(p.x, 0, 50, p.top);
        ctx.strokeRect(p.x, 0, 50, p.top);
        // Bottom pipe
        ctx.fillRect(p.x, p.bottom, 50, 520 - p.bottom);
        ctx.strokeRect(p.x, p.bottom, 50, 520 - p.bottom);
      });

      // Draw Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      const angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.vy * 0.08));
      ctx.rotate(angle);
      // Body
      ctx.fillStyle = '#00ffcc';
      ctx.beginPath(); ctx.arc(0, 0, bird.r, 0, Math.PI * 2); ctx.fill();
      // Eye
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(6, -4, 4, 0, Math.PI * 2); ctx.fill();
      // Beak
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(24, 4); ctx.lineTo(12, 8); ctx.closePath(); ctx.fill();
      // Wing
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath(); ctx.ellipse(-6, 2, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      if (state === 'START') {
        ctx.fillStyle = '#00ffcc';
        ctx.font = 'bold 22px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('TAP TO PLAY', 180, 260);
      } else if (state === 'DEAD') {
        ctx.fillStyle = '#ff3366';
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', 180, 240);
        ctx.font = '14px monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText('Tap to Restart', 180, 280);
      }
    }
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
