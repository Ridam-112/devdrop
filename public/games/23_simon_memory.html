<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Simon Memory - Clay Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(135deg, #e4edf8 0%, #d8e5f5 100%);
      font-family: 'Fredoka', cursive, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #2c3e50;
      padding: 12px;
    }
    #game-container {
      position: relative;
      width: 440px;
      max-width: 96vw;
      background: #fbfdff;
      border-radius: 36px;
      box-shadow: 18px 24px 45px rgba(160, 180, 205, 0.45), -12px -12px 35px #ffffff,
                  inset 4px 4px 8px rgba(255, 255, 255, 0.9), inset -4px -4px 8px rgba(160, 180, 205, 0.2);
      padding: 24px 20px;
      border: 4px solid #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .clay-pill {
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 6px 8px 16px rgba(166, 180, 200, 0.45), inset 3px 3px 6px #ffffff, inset -3px -3px 6px rgba(166, 180, 200, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 700;
    }
    /* Simon 4-Pad Wheel */
    #simon-wheel {
      position: relative;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: #eef2f7;
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 14px;
      box-shadow: 12px 18px 30px rgba(160, 180, 205, 0.45), inset 6px 6px 14px rgba(255, 255, 255, 0.8), inset -6px -6px 14px rgba(160, 180, 205, 0.3);
      border: 4px solid #ffffff;
    }
    .pad {
      border-radius: 28px;
      cursor: pointer;
      box-shadow: 4px 6px 12px rgba(0, 0, 0, 0.15), inset 4px 4px 8px rgba(255, 255, 255, 0.7), inset -4px -4px 8px rgba(0, 0, 0, 0.15);
      border: 3px solid #ffffff;
      transition: all 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .pad:active, .pad.active {
      transform: scale(0.92);
      filter: brightness(1.35) drop-shadow(0 0 16px rgba(255, 255, 255, 0.9));
    }
    #pad-0 { background: #2ecc71; border-top-left-radius: 120px; }
    #pad-1 { background: #e74c3c; border-top-right-radius: 120px; }
    #pad-2 { background: #f1c40f; border-bottom-left-radius: 120px; }
    #pad-3 { background: #3498db; border-bottom-right-radius: 120px; }

    /* Center Hub */
    #center-hub {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 6px 8px 16px rgba(160, 180, 205, 0.45), inset 3px 3px 6px #ffffff, inset -3px -3px 6px rgba(160, 180, 205, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      border: 3px solid #ffffff;
      pointer-events: none;
    }
    /* Modal */
    .screen-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(240, 246, 255, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 20;
      text-align: center;
      border-radius: 36px;
    }
    .screen-modal.hidden { display: none; }
    .clay-card {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 32px;
      box-shadow: 14px 20px 35px rgba(160, 178, 202, 0.4), inset 4px 4px 8px #ffffff;
      border: 3px solid #ffffff;
      width: 100%;
      max-width: 340px;
    }
    .clay-btn {
      background: linear-gradient(135deg, #00cec9 0%, #0984e3 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 6px 10px 18px rgba(9, 132, 227, 0.35), inset 2px 2px 4px #ffffff;
      cursor: pointer;
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="clay-pill">
        <span>🧠</span>
        <span id="level-val">Round 1</span>
      </div>
      <div class="clay-pill">
        <span>⭐</span>
        <span id="best-val">Best: 0</span>
      </div>
      <button class="clay-pill" id="btn-sound" style="padding: 8px 12px; cursor: pointer;">🔊</button>
    </div>

    <!-- 4 Clay Pads -->
    <div id="simon-wheel">
      <div class="pad" id="pad-0"></div>
      <div class="pad" id="pad-1"></div>
      <div class="pad" id="pad-2"></div>
      <div class="pad" id="pad-3"></div>
      <div id="center-hub">💡</div>
    </div>

    <div style="margin-top: 24px; color: #8395a7; font-size: 14px; font-weight: 600;" id="status-hint">
      Watch the pattern, then tap to repeat!
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen-modal">
      <div class="clay-card">
        <div style="font-size: 52px; margin-bottom: 8px;">🧠 💡 🎵</div>
        <h1 style="color: #0984e3; font-size: 28px;">Simon Memory</h1>
        <p style="color: #636e72; font-size: 15px; margin: 10px 0;">Remember and repeat the growing musical sequence of clay light pads!</p>
        <button id="btn-start" class="clay-btn">START CHALLENGE ▶</button>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-modal" class="screen-modal hidden">
      <div class="clay-card">
        <div style="font-size: 48px; margin-bottom: 6px;">💥 🧠</div>
        <h1 style="color: #ff7675; font-size: 28px;">WRONG PAD!</h1>
        <p style="color: #636e72; font-size: 15px; margin: 10px 0;">You pressed the wrong color in the sequence!</p>
        <div style="background: #f0f4f9; padding: 12px; border-radius: 18px; margin: 12px 0;">
          <div style="font-size: 24px; font-weight: 700; color: #0984e3;" id="final-round">Round 1</div>
        </div>
        <button id="btn-restart" class="clay-btn">TRY AGAIN 🔄</button>
      </div>
    </div>
  </div>

  <script>
    class ClaySound {
      constructor() {
        this.ctx = null;
        this.muted = false;
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        } catch (e) {}
      }
      resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
      toggle() { this.muted = !this.muted; return this.muted; }
      playTone(padIdx) {
        if (!this.ctx || this.muted) return;
        this.resume();
        const freqs = [329.63, 261.63, 440.00, 392.00]; // E4, C4, A4, G4
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(freqs[padIdx], this.ctx.currentTime);
        g.gain.setValueAtTime(0.3, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.28);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.3);
      }
      buzzer() {
        if (!this.ctx || this.muted) return;
        this.resume();
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(110, this.ctx.currentTime);
        g.gain.setValueAtTime(0.4, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.4);
      }
    }
    const sound = new ClaySound();

    let sequence = [];
    let playerIndex = 0;
    let isComputerTurn = false;
    let bestRound = parseInt(localStorage.getItem('clay_simon_best') || '0', 10);

    function initGame() {
      sequence = [];
      playerIndex = 0;
      isComputerTurn = true;
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('gameover-modal').classList.add('hidden');
      document.getElementById('best-val').innerText = `Best: ${bestRound}`;
      nextRound();
    }

    function nextRound() {
      playerIndex = 0;
      isComputerTurn = true;
      sequence.push(Math.floor(Math.random() * 4));
      document.getElementById('level-val').innerText = `Round ${sequence.length}`;
      document.getElementById('status-hint').innerText = 'Watch carefully...';

      // Playback sequence
      let i = 0;
      const interval = setInterval(() => {
        flashPad(sequence[i]);
        i++;
        if (i >= sequence.length) {
          clearInterval(interval);
          setTimeout(() => {
            isComputerTurn = false;
            document.getElementById('status-hint').innerText = 'Your turn! Tap the pads!';
          }, 400);
        }
      }, 650);
    }

    function flashPad(padIdx) {
      const pad = document.getElementById(`pad-${padIdx}`);
      pad.classList.add('active');
      sound.playTone(padIdx);
      setTimeout(() => {
        pad.classList.remove('active');
      }, 350);
    }

    function onPadClick(padIdx) {
      if (isComputerTurn) return;

      flashPad(padIdx);

      if (padIdx === sequence[playerIndex]) {
        playerIndex++;
        if (playerIndex >= sequence.length) {
          // Completed round!
          if (sequence.length > bestRound) {
            bestRound = sequence.length;
            localStorage.setItem('clay_simon_best', bestRound);
          }
          isComputerTurn = true;
          document.getElementById('status-hint').innerText = '🌟 Great memory!';
          setTimeout(nextRound, 900);
        }
      } else {
        // Mistake!
        sound.buzzer();
        isComputerTurn = true;
        document.getElementById('final-round').innerText = `Reached Round ${sequence.length}`;
        document.getElementById('gameover-modal').classList.remove('hidden');
      }
    }

    [0, 1, 2, 3].forEach(idx => {
      document.getElementById(`pad-${idx}`).addEventListener('pointerdown', () => onPadClick(idx));
    });

    document.getElementById('btn-start').addEventListener('click', initGame);
    document.getElementById('btn-restart').addEventListener('click', initGame);
    document.getElementById('btn-sound').addEventListener('click', () => {
      const m = sound.toggle();
      document.getElementById('btn-sound').innerText = m ? '🔇' : '🔊';
    });

    document.getElementById('best-val').innerText = `Best: ${bestRound}`;
  </script>
</body>
</html>
