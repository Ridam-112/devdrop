<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mini Tower Defense</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: monospace; }
    body { background: #070d18; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; }
    .game-card { width: 100%; max-width: 440px; background: #0f182c; border: 2px solid #8b5cf644; border-radius: 20px; padding: 14px; text-align: center; box-shadow: 0 10px 40px rgba(139,92,246,0.15); }
    canvas { background: #060a14; border-radius: 12px; border: 2px solid #1e293b; display: block; margin: 0 auto; max-width: 100%; height: auto; cursor: crosshair; }
    .hud { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: #a78bfa; font-weight: bold; }
    .actions { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
    .btn { background: #8b5cf6; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 12px; font-family: monospace; }
    .btn.active { background: #00ffcc; color: #000; }
    .info { font-size: 11px; color: #64748b; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="game-card">
    <div class="hud">
      <div>GOLD: 🪙<span id="gold">100</span></div>
      <div>WAVE: <span id="wave">1</span></div>
      <div>LIVES: ❤️<span id="lives">10</span></div>
    </div>
    <canvas id="c" width="400" height="400"></canvas>
    <div class="actions">
      <button class="btn active" id="btn-dart" onclick="setTowerType('dart')">🏹 Dart ($50)</button>
      <button class="btn" id="btn-cannon" onclick="setTowerType('cannon')">💣 Cannon ($90)</button>
    </div>
    <div class="info">Tap along green grass to place towers! Defend the base from invaders.</div>
  </div>
  <script>
    
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playSound(type) {
    try {
      const ctx = getAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      const now = ctx.currentTime;
      if (type === 'click' || type === 'jump') {
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(750, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'pop') {
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'win') {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.15, now + i*0.1);
          g.gain.linearRampToValueAtTime(0.01, now + i*0.1 + 0.2);
          o.start(now + i*0.1); o.stop(now + i*0.1 + 0.25);
        });
      } else if (type === 'hit' || type === 'lose') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(250, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.25);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      } else if (type === 'score' || type === 'shoot') {
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.06);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
        osc.start(now); osc.stop(now + 0.06);
      }
    } catch(e) {}
  }

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let gold = 100, wave = 1, lives = 10;
    let selectedType = 'dart';
    let towers = [];
    let enemies = [];
    let bullets = [];
    let waveSpawning = false;
    let frame = 0;

    // Waypoints for creep path: (0, 80) -> (140, 80) -> (140, 260) -> (280, 260) -> (280, 100) -> (400, 100)
    const PATH = [
      { x: 0, y: 80 }, { x: 140, y: 80 }, { x: 140, y: 260 },
      { x: 280, y: 260 }, { x: 280, y: 100 }, { x: 400, y: 100 }
    ];

    function setTowerType(type) {
      selectedType = type;
      document.getElementById('btn-dart').classList.toggle('active', type === 'dart');
      document.getElementById('btn-cannon').classList.toggle('active', type === 'cannon');
      playSound('click');
    }

    function spawnWave() {
      waveSpawning = true;
      let count = 6 + wave * 3;
      let spawned = 0;
      const interval = setInterval(() => {
        enemies.push({
          x: PATH[0].x, y: PATH[0].y,
          wp: 1,
          hp: 20 + wave * 12,
          maxHp: 20 + wave * 12,
          speed: 1.3 + Math.random() * 0.4,
          r: 9,
          bounty: 12
        });
        spawned++;
        if (spawned >= count) {
          clearInterval(interval);
          waveSpawning = false;
        }
      }, 700);
    }

    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scale = 400 / rect.width;
      const x = (e.clientX - rect.left) * scale;
      const y = (e.clientY - rect.top) * scale;

      const cost = selectedType === 'dart' ? 50 : 90;
      if (gold < cost) return playSound('hit');

      // Check distance from existing towers and path
      let valid = true;
      towers.forEach(t => { if (Math.hypot(t.x - x, t.y - y) < 30) valid = false; });
      if (!valid) return;

      gold -= cost;
      document.getElementById('gold').innerText = gold;
      towers.push({
        x, y,
        type: selectedType,
        range: selectedType === 'dart' ? 95 : 75,
        damage: selectedType === 'dart' ? 10 : 25,
        cooldown: 0,
        rate: selectedType === 'dart' ? 24 : 45
      });
      playSound('pop');
    });

    function update() {
      frame++;
      // Spawn new wave if all clear
      if (enemies.length === 0 && !waveSpawning) {
        wave++;
        document.getElementById('wave').innerText = wave;
        gold += 30;
        document.getElementById('gold').innerText = gold;
        spawnWave();
      }

      // Move enemies
      enemies.forEach((e, idx) => {
        const target = PATH[e.wp];
        const dx = target.x - e.x;
        const dy = target.y - e.y;
        const dist = Math.hypot(dx, dy);
        if (dist < e.speed) {
          e.wp++;
          if (e.wp >= PATH.length) {
            lives--;
            document.getElementById('lives').innerText = lives;
            enemies.splice(idx, 1);
            playSound('hit');
            return;
          }
        } else {
          e.x += (dx / dist) * e.speed;
          e.y += (dy / dist) * e.speed;
        }
      });

      // Towers attack
      towers.forEach(t => {
        if (t.cooldown > 0) t.cooldown--;
        else {
          // Find first enemy in range
          for (const e of enemies) {
            if (Math.hypot(e.x - t.x, e.y - t.y) <= t.range) {
              t.cooldown = t.rate;
              bullets.push({
                x: t.x, y: t.y,
                tx: e.x, ty: e.y,
                target: e,
                speed: 7,
                damage: t.damage,
                color: t.type === 'dart' ? '#00ffcc' : '#ff3366'
              });
              playSound('shoot');
              break;
            }
          }
        }
      });

      // Move bullets
      bullets.forEach((b, bIdx) => {
        const dx = b.target.x - b.x;
        const dy = b.target.y - b.y;
        const dist = Math.hypot(dx, dy);
        if (dist < b.speed) {
          b.target.hp -= b.damage;
          bullets.splice(bIdx, 1);
          if (b.target.hp <= 0) {
            const eIdx = enemies.indexOf(b.target);
            if (eIdx !== -1) {
              gold += b.target.bounty;
              document.getElementById('gold').innerText = gold;
              enemies.splice(eIdx, 1);
              playSound('score');
            }
          }
        } else {
          b.x += (dx / dist) * b.speed;
          b.y += (dy / dist) * b.speed;
        }
      });
    }

    function draw() {
      ctx.clearRect(0, 0, 400, 400);

      // Draw Path
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 26;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      PATH.forEach((p, i) => { if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
      ctx.stroke();

      // Draw Towers
      towers.forEach(t => {
        ctx.fillStyle = t.type === 'dart' ? '#00ffcc' : '#f59e0b';
        ctx.beginPath(); ctx.arc(t.x, t.y, 12, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      });

      // Draw Bullets
      bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
      });

      // Draw Enemies
      enemies.forEach(e => {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
        // HP bar
        const hpPct = Math.max(0, e.hp / e.maxHp);
        ctx.fillStyle = '#000'; ctx.fillRect(e.x - 10, e.y - 14, 20, 3);
        ctx.fillStyle = '#22c55e'; ctx.fillRect(e.x - 10, e.y - 14, 20 * hpPct, 3);
      });
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    spawnWave();
    loop();
  </script>
</body>
</html>
