<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Whack-a-Mole - Clay Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(135deg, #e4edf8 0%, #d8e5f5 100%);
      font-family: 'Fredoka', cursive, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #2c3e50;
      padding: 12px;
    }
    #game-container {
      position: relative;
      width: 440px;
      max-width: 96vw;
      background: #fbfdff;
      border-radius: 36px;
      box-shadow: 18px 24px 45px rgba(160, 180, 205, 0.45), -12px -12px 35px #ffffff,
                  inset 4px 4px 8px rgba(255, 255, 255, 0.9), inset -4px -4px 8px rgba(160, 180, 205, 0.2);
      padding: 24px 20px;
      border: 4px solid #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .clay-pill {
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 6px 8px 16px rgba(166, 180, 200, 0.45), inset 3px 3px 6px #ffffff, inset -3px -3px 6px rgba(166, 180, 200, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 700;
    }
    /* 3x3 Mole Holes */
    #grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      aspect-ratio: 1;
      background: #55efc4;
      border-radius: 28px;
      padding: 18px;
      box-shadow: inset 4px 4px 10px rgba(0, 0, 0, 0.15), inset -4px -4px 10px rgba(255, 255, 255, 0.6);
      border: 3px solid #ffffff;
    }
    .hole {
      position: relative;
      border-radius: 50%;
      background: #2d3436;
      box-shadow: inset 4px 6px 12px rgba(0, 0, 0, 0.6), inset -2px -2px 6px rgba(255, 255, 255, 0.2);
      overflow: hidden;
      cursor: pointer;
    }
    .mole {
      position: absolute;
      top: 100%;
      left: 15%;
      width: 70%;
      height: 85%;
      border-radius: 36px 36px 10px 10px;
      background: #b2bec3;
      box-shadow: 4px 6px 12px rgba(0, 0, 0, 0.25), inset 3px 3px 6px rgba(255, 255, 255, 0.6);
      transition: top 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }
    .mole.up {
      top: 15%;
    }
    .mole.whacked {
      transform: scale(0.85);
      background: #ff7675 !important;
    }
    /* Modal */
    .screen-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(240, 246, 255, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 20;
      text-align: center;
      border-radius: 36px;
    }
    .screen-modal.hidden { display: none; }
    .clay-card {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 32px;
      box-shadow: 14px 20px 35px rgba(160, 178, 202, 0.4), inset 4px 4px 8px #ffffff;
      border: 3px solid #ffffff;
      width: 100%;
      max-width: 340px;
    }
    .clay-btn {
      background: linear-gradient(135deg, #00b894 0%, #00cec9 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 6px 10px 18px rgba(0, 184, 148, 0.35), inset 2px 2px 4px #ffffff;
      cursor: pointer;
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="clay-pill">
        <span>🔨</span>
        <span id="score-val">0</span>
      </div>
      <div class="clay-pill">
        <span>⏱️</span>
        <span id="timer-val">30s</span>
      </div>
      <button class="clay-pill" id="btn-sound" style="padding: 8px 12px; cursor: pointer;">🔊</button>
    </div>

    <!-- 3x3 Mole Holes -->
    <div id="grid">
      <div class="hole"><div class="mole" id="m-0">🐹</div></div>
      <div class="hole"><div class="mole" id="m-1">🐹</div></div>
      <div class="hole"><div class="mole" id="m-2">🐹</div></div>
      <div class="hole"><div class="mole" id="m-3">🐹</div></div>
      <div class="hole"><div class="mole" id="m-4">🐹</div></div>
      <div class="hole"><div class="mole" id="m-5">🐹</div></div>
      <div class="hole"><div class="mole" id="m-6">🐹</div></div>
      <div class="hole"><div class="mole" id="m-7">🐹</div></div>
      <div class="hole"><div class="mole" id="m-8">🐹</div></div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen-modal">
      <div class="clay-card">
        <div style="font-size: 52px; margin-bottom: 8px;">🔨 🐹 ✨</div>
        <h1 style="color: #00b894; font-size: 28px;">Whack-a-Mole</h1>
        <p style="color: #636e72; font-size: 15px; margin: 10px 0;">Bonk the cute clay moles as fast as you can in 30 seconds! Avoid hitting bombs!</p>
        <button id="btn-start" class="clay-btn">START BONKING ▶</button>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameover-modal" class="screen-modal hidden">
      <div class="clay-card">
        <div style="font-size: 48px; margin-bottom: 6px;">🎉 🏆 🐹</div>
        <h1 style="color: #00b894; font-size: 28px;">TIME'S UP!</h1>
        <p style="color: #636e72; font-size: 15px; margin: 10px 0;">Spectacular mole whacking reflexes!</p>
        <div style="background: #f0f4f9; padding: 12px; border-radius: 18px; margin: 12px 0;">
          <div style="font-size: 26px; font-weight: 700; color: #00b894;" id="final-score">0</div>
          <div style="font-size: 11px; color: #829ab1; text-transform: uppercase;">Total Score</div>
        </div>
        <button id="btn-restart" class="clay-btn">PLAY AGAIN 🔄</button>
      </div>
    </div>
  </div>

  <script>
    class ClaySound {
      constructor() {
        this.ctx = null;
        this.muted = false;
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        } catch (e) {}
      }
      resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
      toggle() { this.muted = !this.muted; return this.muted; }
      bonk() {
        if (!this.ctx || this.muted) return;
        this.resume();
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(440, this.ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.08);
        g.gain.setValueAtTime(0.35, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.1);
      }
      boom() {
        if (!this.ctx || this.muted) return;
        this.resume();
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(140, this.ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.25);
        g.gain.setValueAtTime(0.4, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.3);
      }
    }
    const sound = new ClaySound();

    let score = 0;
    let timeLeft = 30;
    let timerId = null;
    let moleInterval = null;
    let activeMoles = [];

    function initGame() {
      score = 0;
      timeLeft = 30;
      activeMoles = [];
      document.getElementById('score-val').innerText = score;
      document.getElementById('timer-val').innerText = `${timeLeft}s`;
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('gameover-modal').classList.add('hidden');

      clearInterval(timerId);
      clearInterval(moleInterval);

      timerId = setInterval(() => {
        timeLeft--;
        document.getElementById('timer-val').innerText = `${timeLeft}s`;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);

      moleInterval = setInterval(popMole, 650);
    }

    function popMole() {
      const idx = Math.floor(Math.random() * 9);
      const moleEl = document.getElementById(`m-${idx}`);

      if (moleEl.classList.contains('up')) return;

      const isBomb = Math.random() < 0.2;
      const isGold = !isBomb && Math.random() < 0.25;

      moleEl.innerText = isBomb ? '💣' : (isGold ? '👑' : '🐹');
      moleEl.style.background = isGold ? '#f1c40f' : (isBomb ? '#2d3436' : '#d6a2e8');
      moleEl.classList.remove('whacked');
      moleEl.classList.add('up');
      moleEl.dataset.type = isBomb ? 'bomb' : (isGold ? 'gold' : 'normal');

      setTimeout(() => {
        moleEl.classList.remove('up');
      }, 950);
    }

    function whack(idx) {
      const moleEl = document.getElementById(`m-${idx}`);
      if (!moleEl.classList.contains('up') || moleEl.classList.contains('whacked')) return;

      moleEl.classList.add('whacked');
      const type = moleEl.dataset.type;

      if (type === 'bomb') {
        sound.boom();
        score = Math.max(0, score - 5);
      } else if (type === 'gold') {
        sound.bonk();
        score += 3;
      } else {
        sound.bonk();
        score += 1;
      }

      document.getElementById('score-val').innerText = score;
      setTimeout(() => { moleEl.classList.remove('up'); }, 200);
    }

    function endGame() {
      clearInterval(timerId);
      clearInterval(moleInterval);
      document.querySelectorAll('.mole').forEach(m => m.classList.remove('up'));
      document.getElementById('final-score').innerText = score;
      document.getElementById('gameover-modal').classList.remove('hidden');
    }

    document.querySelectorAll('.hole').forEach((h, idx) => {
      h.addEventListener('pointerdown', () => whack(idx));
    });

    document.getElementById('btn-start').addEventListener('click', initGame);
    document.getElementById('btn-restart').addEventListener('click', initGame);
    document.getElementById('btn-sound').addEventListener('click', () => {
      const m = sound.toggle();
      document.getElementById('btn-sound').innerText = m ? '🔇' : '🔊';
    });
  </script>
</body>
</html>
