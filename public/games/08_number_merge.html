<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Number Merge - Clay Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(135deg, #e4edf8 0%, #d8e5f5 100%);
      font-family: 'Fredoka', cursive, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #2c3e50;
      padding: 12px;
    }
    #game-container {
      position: relative;
      width: 440px;
      max-width: 96vw;
      background: #fbfdff;
      border-radius: 36px;
      box-shadow: 18px 24px 45px rgba(160, 180, 205, 0.45), -12px -12px 35px #ffffff,
                  inset 4px 4px 8px rgba(255, 255, 255, 0.9), inset -4px -4px 8px rgba(160, 180, 205, 0.2);
      padding: 20px 18px;
      border: 4px solid #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .clay-pill {
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 6px 8px 16px rgba(166, 180, 200, 0.45), inset 3px 3px 6px #ffffff, inset -3px -3px 6px rgba(166, 180, 200, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 700;
    }
    /* Next Dropper Indicator */
    .dropper-preview {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .tile {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      box-shadow: 4px 6px 12px rgba(0, 0, 0, 0.15), inset 3px 3px 6px rgba(255, 255, 255, 0.6), inset -3px -3px 6px rgba(0, 0, 0, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.5);
      transition: transform 0.15s, opacity 0.15s;
    }
    /* 5 Column Board */
    #board-columns {
      display: flex;
      gap: 8px;
      width: 100%;
      height: 420px;
      background: #eef2f7;
      border-radius: 26px;
      padding: 8px;
      box-shadow: inset 4px 4px 10px rgba(160, 180, 205, 0.45), inset -4px -4px 10px #ffffff;
    }
    .col {
      flex: 1;
      height: 100%;
      border-radius: 18px;
      background: rgba(220, 230, 242, 0.5);
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      gap: 6px;
      padding-bottom: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .col:hover {
      background: rgba(220, 230, 242, 0.85);
    }
    .col .tile {
      width: 100%;
      max-width: 58px;
      height: 58px;
      animation: dropPop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes dropPop {
      from { transform: translateY(-40px) scale(0.8); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }
    /* Modal */
    .screen-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(240, 246, 255, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 20;
      text-align: center;
      border-radius: 36px;
    }
    .screen-modal.hidden { display: none; }
    .clay-card {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 32px;
      box-shadow: 14px 20px 35px rgba(160, 178, 202, 0.4), inset 4px 4px 8px #ffffff;
      border: 3px solid #ffffff;
      width: 100%;
      max-width: 340px;
    }
    .clay-btn {
      background: linear-gradient(135deg, #0984e3 0%, #74b9ff 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 6px 10px 18px rgba(9, 132, 227, 0.35), inset 2px 2px 4px #ffffff;
      cursor: pointer;
      margin-top: 18px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="clay-pill">
        <span>🔢</span>
        <span id="score-val">0</span>
      </div>
      <div class="clay-pill">
        <span>🏆</span>
        <span id="best-val">0</span>
      </div>
      <button class="clay-pill" id="btn-sound" style="padding: 8px 12px; cursor: pointer;">🔊</button>
    </div>

    <!-- Next Incoming Tile -->
    <div class="dropper-preview">
      <span style="font-weight: 700; color: #8395a7; font-size: 14px;">NEXT:</span>
      <div class="tile" id="next-tile">2</div>
    </div>

    <!-- 5 Columns Container -->
    <div id="board-columns">
      <div class="col" data-col="0"></div>
      <div class="col" data-col="1"></div>
      <div class="col" data-col="2"></div>
      <div class="col" data-col="3"></div>
      <div class="col" data-col="4"></div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameover-modal" class="screen-modal hidden">
      <div class="clay-card">
        <div style="font-size: 48px; margin-bottom: 6px;">💥 🔢</div>
        <h1 style="color: #ff7675; font-size: 28px;">COLUMN FULL!</h1>
        <p style="color: #636e72; font-size: 15px; margin: 10px 0;">No more room to drop numbers!</p>
        <div style="background: #f0f4f9; padding: 12px; border-radius: 18px; margin: 12px 0;">
          <div style="font-size: 24px; font-weight: 700; color: #0984e3;" id="final-score">0</div>
          <div style="font-size: 11px; color: #829ab1; text-transform: uppercase;">Final Score</div>
        </div>
        <button id="btn-restart" class="clay-btn">PLAY AGAIN 🔄</button>
      </div>
    </div>
  </div>

  <script>
    class ClaySound {
      constructor() {
        this.ctx = null;
        this.muted = false;
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        } catch (e) {}
      }
      resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
      toggle() { this.muted = !this.muted; return this.muted; }
      drop() {
        if (!this.ctx || this.muted) return;
        this.resume();
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(420, this.ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(180, this.ctx.currentTime + 0.08);
        g.gain.setValueAtTime(0.25, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.09);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.09);
      }
      merge(val) {
        if (!this.ctx || this.muted) return;
        this.resume();
        const freq = 300 + Math.min(val * 15, 800);
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(freq, this.ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(freq * 1.5, this.ctx.currentTime + 0.12);
        g.gain.setValueAtTime(0.3, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.15);
      }
    }
    const sound = new ClaySound();

    const TILE_COLORS = {
      2: '#ff7675',
      4: '#fdcb6e',
      8: '#55efc4',
      16: '#0984e3',
      32: '#a29bfe',
      64: '#e84393',
      128: '#00cec9',
      256: '#6c5ce7',
      512: '#e17055',
      1024: '#d63031',
      2048: '#f1c40f'
    };

    const COLS = 5;
    const MAX_ROWS = 6;
    let columns = [[], [], [], [], []];
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('number_merge_best') || '0', 10);
    let nextValue = 2;

    function getRandomValue() {
      const vals = [2, 4, 8, 16];
      return vals[Math.floor(Math.random() * vals.length)];
    }

    function createTileElement(val) {
      const el = document.createElement('div');
      el.className = 'tile';
      el.innerText = val;
      el.style.background = TILE_COLORS[val] || '#6c5ce7';
      return el;
    }

    function updateNextTile() {
      nextValue = getRandomValue();
      const nEl = document.getElementById('next-tile');
      nEl.innerText = nextValue;
      nEl.style.background = TILE_COLORS[nextValue] || '#ff7675';
    }

    function renderColumns() {
      for (let c = 0; c < COLS; c++) {
        const colEl = document.querySelector(`.col[data-col="${c}"]`);
        colEl.innerHTML = '';
        columns[c].forEach(val => {
          colEl.appendChild(createTileElement(val));
        });
      }
    }

    function dropInColumn(colIdx) {
      if (columns[colIdx].length >= MAX_ROWS) {
        // Game Over check
        checkGameOver();
        return;
      }

      columns[colIdx].push(nextValue);
      sound.drop();
      updateNextTile();
      processMerges(colIdx);
      renderColumns();
      updateHUD();
      checkGameOver();
    }

    function processMerges(colIdx) {
      let merged = false;
      const col = columns[colIdx];

      // Check if last two in column are identical
      if (col.length >= 2 && col[col.length - 1] === col[col.length - 2]) {
        const val = col.pop();
        col[col.length - 1] = val * 2;
        score += val * 2;
        sound.merge(val * 2);
        merged = true;
      }

      // Check adjacent columns for matches with current top
      if (col.length > 0) {
        const topRow = col.length - 1;
        const val = col[topRow];

        // Left match
        if (colIdx > 0 && columns[colIdx - 1].length > topRow && columns[colIdx - 1][topRow] === val) {
          columns[colIdx - 1].splice(topRow, 1);
          col[topRow] = val * 2;
          score += val * 2;
          sound.merge(val * 2);
          merged = true;
        }
        // Right match
        if (colIdx < COLS - 1 && columns[colIdx + 1].length > topRow && columns[colIdx + 1][topRow] === val) {
          columns[colIdx + 1].splice(topRow, 1);
          col[topRow] = val * 2;
          score += val * 2;
          sound.merge(val * 2);
          merged = true;
        }
      }

      if (merged) {
        // Cascade check again
        processMerges(colIdx);
      }
    }

    function checkGameOver() {
      const allFull = columns.every(c => c.length >= MAX_ROWS);
      if (allFull) {
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('number_merge_best', bestScore);
        }
        document.getElementById('final-score').innerText = score;
        document.getElementById('gameover-modal').classList.remove('hidden');
      }
    }

    function updateHUD() {
      document.getElementById('score-val').innerText = score;
      document.getElementById('best-val').innerText = bestScore;
    }

    function initGame() {
      columns = [[], [], [], [], []];
      score = 0;
      document.getElementById('gameover-modal').classList.add('hidden');
      updateNextTile();
      renderColumns();
      updateHUD();
    }

    document.querySelectorAll('.col').forEach(colEl => {
      colEl.addEventListener('click', () => {
        const c = parseInt(colEl.dataset.col, 10);
        dropInColumn(c);
      });
    });

    document.getElementById('btn-restart').addEventListener('click', initGame);
    document.getElementById('btn-sound').addEventListener('click', () => {
      const m = sound.toggle();
      document.getElementById('btn-sound').innerText = m ? '🔇' : '🔊';
    });

    initGame();
  </script>
</body>
</html>
