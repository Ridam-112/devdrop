<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Doodle Jumper Platformer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: monospace; }
    body { background: #0c1322; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; touch-action: none; }
    .game-card { width: 100%; max-width: 400px; background: #131c31; border: 2px solid #38bdf844; border-radius: 20px; padding: 14px; text-align: center; box-shadow: 0 10px 40px rgba(56,189,248,0.15); }
    canvas { background: #070d18; border-radius: 12px; border: 2px solid #223254; display: block; margin: 0 auto; max-width: 100%; height: auto; }
    .hud { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: #38bdf8; font-weight: bold; }
    .controls { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
    .c-btn { background: #223254; color: #fff; border: 1px solid #38bdf855; border-radius: 8px; padding: 10px 24px; font-size: 18px; cursor: pointer; flex: 1; }
    .c-btn:active { background: #38bdf8; color: #000; }
    .info { font-size: 11px; color: #64748b; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="game-card">
    <div class="hud">
      <div>SCORE: <span id="score">0</span></div>
      <div>HIGH: <span id="high">0</span></div>
    </div>
    <canvas id="c" width="360" height="520"></canvas>
    <div class="controls">
      <button class="c-btn" id="btn-left">◀ Left</button>
      <button class="c-btn" id="btn-right">Right ▶</button>
    </div>
    <div class="info">Desktop: Left/Right Arrow Keys | Mobile: Tap buttons or touch screen sides</div>
  </div>
  <script>
    
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playSound(type) {
    try {
      const ctx = getAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      const now = ctx.currentTime;
      if (type === 'click' || type === 'jump') {
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(750, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'pop') {
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'win') {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.15, now + i*0.1);
          g.gain.linearRampToValueAtTime(0.01, now + i*0.1 + 0.2);
          o.start(now + i*0.1); o.stop(now + i*0.1 + 0.25);
        });
      } else if (type === 'hit' || type === 'lose') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(250, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.25);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      } else if (type === 'score' || type === 'shoot') {
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.06);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
        osc.start(now); osc.stop(now + 0.06);
      }
    } catch(e) {}
  }

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let high = parseInt(localStorage.getItem('doodle_high') || '0');
    document.getElementById('high').innerText = high;
    let score = 0;
    let player = { x: 180, y: 350, vx: 0, vy: -10, r: 16 };
    let platforms = [];
    let state = 'PLAY';
    let moveLeft = false, moveRight = false;

    function reset() {
      player = { x: 180, y: 350, vx: 0, vy: -10, r: 16 };
      score = 0;
      document.getElementById('score').innerText = '0';
      platforms = [];
      platforms.push({ x: 140, y: 450, w: 80, h: 14 });
      for (let i = 0; i < 7; i++) {
        platforms.push({
          x: Math.random() * (360 - 70),
          y: 450 - i * 65,
          w: 70, h: 14
        });
      }
      state = 'PLAY';
      playSound('pop');
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = true;
      if (e.key === 'ArrowRight' || e.key === 'd') moveRight = true;
      if (state === 'DEAD' && e.code === 'Space') reset();
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = false;
      if (e.key === 'ArrowRight' || e.key === 'd') moveRight = false;
    });

    const bLeft = document.getElementById('btn-left');
    const bRight = document.getElementById('btn-right');
    bLeft.addEventListener('pointerdown', (e) => { e.preventDefault(); moveLeft = true; });
    bLeft.addEventListener('pointerup', () => moveLeft = false);
    bRight.addEventListener('pointerdown', (e) => { e.preventDefault(); moveRight = true; });
    bRight.addEventListener('pointerup', () => moveRight = false);

    canvas.addEventListener('pointerdown', (e) => {
      if (state === 'DEAD') return reset();
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      if (x < rect.width / 2) moveLeft = true;
      else moveRight = true;
    });
    canvas.addEventListener('pointerup', () => { moveLeft = false; moveRight = false; });

    function update() {
      if (state !== 'PLAY') return;
      if (moveLeft) player.vx = -5;
      else if (moveRight) player.vx = 5;
      else player.vx *= 0.8;

      player.x += player.vx;
      if (player.x < -10) player.x = 370;
      if (player.x > 370) player.x = -10;

      player.vy += 0.38; // gravity
      player.y += player.vy;

      // Platform bounce
      if (player.vy > 0) {
        platforms.forEach(p => {
          if (player.x + 12 > p.x && player.x - 12 < p.x + p.w &&
              player.y + player.r >= p.y && player.y + player.r <= p.y + p.h + player.vy) {
            player.vy = -10.5;
            playSound('jump');
          }
        });
      }

      // Camera scroll upward
      if (player.y < 240) {
        const diff = 240 - player.y;
        player.y = 240;
        score += Math.floor(diff);
        document.getElementById('score').innerText = score;
        if (score > high) {
          high = score;
          localStorage.setItem('doodle_high', high);
          document.getElementById('high').innerText = high;
        }

        platforms.forEach(p => p.y += diff);
        platforms = platforms.filter(p => p.y < 530);

        while (platforms.length < 8) {
          const topY = Math.min(...platforms.map(p => p.y));
          platforms.push({
            x: Math.random() * (360 - 70),
            y: topY - (55 + Math.random() * 25),
            w: 70, h: 14
          });
        }
      }

      if (player.y > 540) {
        state = 'DEAD';
        playSound('hit');
      }
    }

    function draw() {
      ctx.clearRect(0, 0, 360, 520);
      // Grid stars
      ctx.fillStyle = '#ffffff15';
      for (let i = 0; i < 20; i++) {
        ctx.fillRect((i * 47) % 360, (i * 83) % 520, 2, 2);
      }

      // Draw platforms
      platforms.forEach(p => {
        ctx.fillStyle = '#10b981';
        ctx.beginPath();
        ctx.roundRect(p.x, p.y, p.w, p.h, 6);
        ctx.fill();
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      // Draw Player
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
      ctx.fill();
      // Eyes
      ctx.fillStyle = '#000';
      const eyeDir = player.vx >= 0 ? 4 : -4;
      ctx.beginPath(); ctx.arc(player.x + eyeDir, player.y - 4, 3, 0, Math.PI * 2); ctx.fill();
      // Snout
      ctx.fillStyle = '#0284c7';
      ctx.beginPath(); ctx.arc(player.x + eyeDir * 1.5, player.y + 4, 5, 0, Math.PI * 2); ctx.fill();

      if (state === 'DEAD') {
        ctx.fillStyle = '#ff3366';
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('FALLEN! GAME OVER', 180, 240);
        ctx.font = '14px monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText('Tap Screen to Jump Again', 180, 270);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    reset();
    loop();
  </script>
</body>
</html>
