<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Block Puzzle - Clay Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(135deg, #e4edf8 0%, #d8e5f5 100%);
      font-family: 'Fredoka', cursive, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #2c3e50;
      padding: 12px;
    }
    #game-container {
      position: relative;
      width: 440px;
      max-width: 96vw;
      background: #fbfdff;
      border-radius: 36px;
      box-shadow: 18px 24px 45px rgba(160, 180, 205, 0.45), -12px -12px 35px #ffffff,
                  inset 4px 4px 8px rgba(255, 255, 255, 0.9), inset -4px -4px 8px rgba(160, 180, 205, 0.2);
      padding: 20px 18px;
      border: 4px solid #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .clay-pill {
      background: #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      box-shadow: 6px 8px 16px rgba(166, 180, 200, 0.45), inset 3px 3px 6px #ffffff, inset -3px -3px 6px rgba(166, 180, 200, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 17px;
      font-weight: 700;
    }
    /* 8x8 Board */
    #board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
      width: 100%;
      aspect-ratio: 1;
      background: #eef2f7;
      padding: 10px;
      border-radius: 26px;
      box-shadow: inset 4px 4px 10px rgba(160, 180, 205, 0.5), inset -4px -4px 10px #ffffff;
    }
    .cell {
      border-radius: 8px;
      background: #e4e9f0;
      box-shadow: inset 2px 2px 4px rgba(160, 180, 205, 0.4), inset -2px -2px 4px #ffffff;
      transition: background 0.15s, transform 0.15s;
    }
    .cell.filled {
      border-radius: 8px;
      box-shadow: 3px 4px 8px rgba(0, 0, 0, 0.15), inset 2px 2px 4px rgba(255, 255, 255, 0.6), inset -2px -2px 4px rgba(0, 0, 0, 0.15);
    }
    /* Shape Tray */
    #tray {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      height: 120px;
      margin-top: 14px;
      background: #f0f4f9;
      border-radius: 24px;
      padding: 8px;
      box-shadow: inset 2px 2px 6px rgba(160, 180, 205, 0.3), inset -2px -2px 6px #ffffff;
    }
    .shape-slot {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      cursor: grab;
    }
    .mini-grid {
      display: grid;
      gap: 3px;
      transform: scale(0.85);
      transition: transform 0.1s;
    }
    .mini-grid:hover { transform: scale(0.95); }
    .mini-cell {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      box-shadow: 2px 3px 5px rgba(0, 0, 0, 0.15), inset 1px 1px 2px rgba(255, 255, 255, 0.6);
    }
    /* Modal */
    .screen-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(240, 246, 255, 0.9);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 20;
      text-align: center;
      border-radius: 36px;
    }
    .screen-modal.hidden { display: none; }
    .clay-card {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 32px;
      box-shadow: 14px 20px 35px rgba(160, 178, 202, 0.4), inset 4px 4px 8px #ffffff;
      border: 3px solid #ffffff;
      width: 100%;
      max-width: 340px;
    }
    .clay-btn {
      background: linear-gradient(135deg, #ff7675 0%, #d63031 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 6px 10px 18px rgba(214, 48, 49, 0.35), inset 2px 2px 4px #ffffff, inset -3px -3px 5px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="hud">
      <div class="clay-pill">
        <span>🧩</span>
        <span id="score-val">0</span>
      </div>
      <div class="clay-pill">
        <span>🏆</span>
        <span id="best-val">0</span>
      </div>
      <button class="clay-pill" id="btn-sound" style="padding: 8px 12px; cursor: pointer;">🔊</button>
    </div>

    <!-- 8x8 Board -->
    <div id="board"></div>

    <!-- 3 Shape Slots -->
    <div id="tray">
      <div class="shape-slot" id="slot-0"></div>
      <div class="shape-slot" id="slot-1"></div>
      <div class="shape-slot" id="slot-2"></div>
    </div>

    <!-- Game Over Modal -->
    <div id="gameover-modal" class="screen-modal hidden">
      <div class="clay-card">
        <div style="font-size: 48px; margin-bottom: 6px;">💥 🧩</div>
        <h1 style="color: #ff7675; font-size: 28px;">NO MORE MOVES!</h1>
        <p style="color: #636e72; font-size: 15px; margin: 10px 0;">No available pieces fit onto the grid.</p>
        <div style="background: #f0f4f9; padding: 12px; border-radius: 18px; margin: 12px 0;">
          <div style="font-size: 24px; font-weight: 700; color: #ff7675;" id="final-score">0</div>
          <div style="font-size: 11px; color: #829ab1; text-transform: uppercase;">Final Score</div>
        </div>
        <button id="btn-restart" class="clay-btn">PLAY AGAIN 🔄</button>
      </div>
    </div>
  </div>

  <script>
    class ClaySound {
      constructor() {
        this.ctx = null;
        this.muted = false;
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        } catch (e) {}
      }
      resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
      toggle() { this.muted = !this.muted; return this.muted; }
      place() {
        if (!this.ctx || this.muted) return;
        this.resume();
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(340, this.ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.08);
        g.gain.setValueAtTime(0.3, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.1);
      }
      clear() {
        if (!this.ctx || this.muted) return;
        this.resume();
        const now = this.ctx.currentTime;
        [587.33, 880, 1174.66].forEach((f, idx) => {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = 'triangle';
          o.frequency.value = f;
          g.gain.setValueAtTime(0.25, now + idx * 0.06);
          g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.06 + 0.14);
          o.connect(g); g.connect(this.ctx.destination);
          o.start(now + idx * 0.06); o.stop(now + idx * 0.06 + 0.15);
        });
      }
    }
    const sound = new ClaySound();

    const GRID_SIZE = 8;
    let grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('block_puzzle_best') || '0', 10);
    let trayShapes = [null, null, null];
    let selectedSlot = null;

    const SHAPES = [
      { matrix: [[1]], color: '#ff7675' },
      { matrix: [[1, 1]], color: '#fdcb6e' },
      { matrix: [[1], [1]], color: '#fdcb6e' },
      { matrix: [[1, 1, 1]], color: '#55efc4' },
      { matrix: [[1], [1], [1]], color: '#55efc4' },
      { matrix: [[1, 1], [1, 1]], color: '#0984e3' },
      { matrix: [[1, 0], [1, 1]], color: '#a29bfe' },
      { matrix: [[0, 1], [1, 1]], color: '#a29bfe' },
      { matrix: [[1, 1, 1], [0, 1, 0]], color: '#e84393' }
    ];

    function createBoardUI() {
      const boardEl = document.getElementById('board');
      boardEl.innerHTML = '';
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.r = r;
          cell.dataset.c = c;
          cell.addEventListener('click', () => onBoardCellClick(r, c));
          boardEl.appendChild(cell);
        }
      }
    }

    function renderBoard() {
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const idx = r * GRID_SIZE + c;
          const cell = document.getElementById('board').children[idx];
          if (grid[r][c]) {
            cell.className = 'cell filled';
            cell.style.background = grid[r][c];
          } else {
            cell.className = 'cell';
            cell.style.background = '#e4e9f0';
          }
        }
      }
    }

    function refillTray() {
      for (let i = 0; i < 3; i++) {
        if (!trayShapes[i]) {
          trayShapes[i] = SHAPES[Math.floor(Math.random() * SHAPES.length)];
        }
      }
      renderTray();
    }

    function renderTray() {
      for (let i = 0; i < 3; i++) {
        const slotEl = document.getElementById(`slot-${i}`);
        slotEl.innerHTML = '';
        const shape = trayShapes[i];
        if (shape) {
          const mini = document.createElement('div');
          mini.className = 'mini-grid';
          mini.style.gridTemplateColumns = `repeat(${shape.matrix[0].length}, 20px)`;
          if (selectedSlot === i) mini.style.transform = 'scale(1.15)';

          shape.matrix.forEach(row => {
            row.forEach(val => {
              const mc = document.createElement('div');
              if (val) {
                mc.className = 'mini-cell';
                mc.style.background = shape.color;
              }
              mini.appendChild(mc);
            });
          });

          slotEl.onclick = () => {
            selectedSlot = (selectedSlot === i ? null : i);
            renderTray();
          };
          slotEl.appendChild(mini);
        }
      }
    }

    function canPlaceShape(matrix, startR, startC) {
      for (let r = 0; r < matrix.length; r++) {
        for (let c = 0; c < matrix[0].length; c++) {
          if (matrix[r][c]) {
            const br = startR + r;
            const bc = startC + c;
            if (br < 0 || br >= GRID_SIZE || bc < 0 || bc >= GRID_SIZE || grid[br][bc]) {
              return false;
            }
          }
        }
      }
      return true;
    }

    function onBoardCellClick(r, c) {
      if (selectedSlot === null || !trayShapes[selectedSlot]) return;

      const shape = trayShapes[selectedSlot];
      if (canPlaceShape(shape.matrix, r, c)) {
        // Place piece
        for (let row = 0; row < shape.matrix.length; row++) {
          for (let col = 0; col < shape.matrix[0].length; col++) {
            if (shape.matrix[row][col]) {
              grid[r + row][c + col] = shape.color;
              score += 1;
            }
          }
        }
        sound.place();
        trayShapes[selectedSlot] = null;
        selectedSlot = null;

        checkLineClears();
        renderBoard();

        // If tray is empty, refill
        if (trayShapes.every(s => s === null)) {
          refillTray();
        } else {
          renderTray();
        }

        updateHUD();
        checkGameOver();
      }
    }

    function checkLineClears() {
      let rowsToClear = [];
      let colsToClear = [];

      for (let r = 0; r < GRID_SIZE; r++) {
        if (grid[r].every(c => c !== null)) rowsToClear.push(r);
      }
      for (let c = 0; c < GRID_SIZE; c++) {
        let full = true;
        for (let r = 0; r < GRID_SIZE; r++) {
          if (grid[r][c] === null) { full = false; break; }
        }
        if (full) colsToClear.push(c);
      }

      if (rowsToClear.length > 0 || colsToClear.length > 0) {
        rowsToClear.forEach(r => { for (let c = 0; c < GRID_SIZE; c++) grid[r][c] = null; });
        colsToClear.forEach(c => { for (let r = 0; r < GRID_SIZE; r++) grid[r][c] = null; });
        const lines = rowsToClear.length + colsToClear.length;
        score += lines * 10 * lines;
        sound.clear();
      }
    }

    function checkGameOver() {
      const activeShapes = trayShapes.filter(s => s !== null);
      let anyCanFit = false;

      for (let s of activeShapes) {
        for (let r = 0; r < GRID_SIZE; r++) {
          for (let c = 0; c < GRID_SIZE; c++) {
            if (canPlaceShape(s.matrix, r, c)) {
              anyCanFit = true;
              break;
            }
          }
          if (anyCanFit) break;
        }
        if (anyCanFit) break;
      }

      if (!anyCanFit && activeShapes.length > 0) {
        if (score > bestScore) {
          bestScore = score;
          localStorage.setItem('block_puzzle_best', bestScore);
        }
        document.getElementById('final-score').innerText = score;
        document.getElementById('gameover-modal').classList.remove('hidden');
      }
    }

    function updateHUD() {
      document.getElementById('score-val').innerText = score;
      document.getElementById('best-val').innerText = bestScore;
    }

    function initGame() {
      grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null));
      score = 0;
      trayShapes = [null, null, null];
      selectedSlot = null;
      document.getElementById('gameover-modal').classList.add('hidden');
      createBoardUI();
      refillTray();
      renderBoard();
      updateHUD();
    }

    document.getElementById('btn-restart').addEventListener('click', initGame);
    document.getElementById('btn-sound').addEventListener('click', () => {
      const m = sound.toggle();
      document.getElementById('btn-sound').innerText = m ? '🔇' : '🔊';
    });

    initGame();
  </script>
</body>
</html>
