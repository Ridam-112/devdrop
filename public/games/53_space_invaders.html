<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro Space Invaders</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: monospace; }
    body { background: #050811; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; touch-action: none; }
    .game-card { width: 100%; max-width: 440px; background: #0c1220; border: 2px solid #22c55e44; border-radius: 20px; padding: 14px; text-align: center; box-shadow: 0 10px 40px rgba(34,197,94,0.15); }
    canvas { background: #020408; border-radius: 12px; border: 2px solid #1e293b; display: block; margin: 0 auto; max-width: 100%; height: auto; }
    .hud { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; color: #22c55e; font-weight: bold; }
    .controls { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
    .c-btn { background: #1e293b; color: #fff; border: 1px solid #22c55e55; border-radius: 8px; padding: 10px 18px; font-size: 16px; cursor: pointer; flex: 1; }
    .c-btn:active { background: #22c55e; color: #000; }
    .info { font-size: 11px; color: #64748b; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="game-card">
    <div class="hud">
      <div>SCORE: <span id="score">0</span></div>
      <div>WAVE: <span id="wave">1</span></div>
      <div>LIVES: <span id="lives">❤️❤️❤️</span></div>
    </div>
    <canvas id="c" width="400" height="500"></canvas>
    <div class="controls">
      <button class="c-btn" id="b-left">◀ Left</button>
      <button class="c-btn" id="b-fire" style="background:#22c55e33;border-color:#22c55e">🔥 Fire</button>
      <button class="c-btn" id="b-right">Right ▶</button>
    </div>
    <div class="info">Desktop: Arrow Keys / A-D to Move, Space to Fire | Mobile: Touch Buttons</div>
  </div>
  <script>
    
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  function getAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function playSound(type) {
    try {
      const ctx = getAudio();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      const now = ctx.currentTime;
      if (type === 'click' || type === 'jump') {
        osc.frequency.setValueAtTime(450, now);
        osc.frequency.exponentialRampToValueAtTime(750, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now); osc.stop(now + 0.08);
      } else if (type === 'pop') {
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
        osc.start(now); osc.stop(now + 0.1);
      } else if (type === 'win') {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const o = ctx.createOscillator();
          const g = ctx.createGain();
          o.connect(g); g.connect(ctx.destination);
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.15, now + i*0.1);
          g.gain.linearRampToValueAtTime(0.01, now + i*0.1 + 0.2);
          o.start(now + i*0.1); o.stop(now + i*0.1 + 0.25);
        });
      } else if (type === 'hit' || type === 'lose') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(250, now);
        osc.frequency.exponentialRampToValueAtTime(70, now + 0.25);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now); osc.stop(now + 0.25);
      } else if (type === 'score' || type === 'shoot') {
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.06);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
        osc.start(now); osc.stop(now + 0.06);
      }
    } catch(e) {}
  }

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let score = 0, wave = 1, lives = 3;
    let player = { x: 180, y: 460, w: 30, h: 16 };
    let bullets = [];
    let alienBullets = [];
    let aliens = [];
    let alienDir = 1, alienSpeed = 1.2;
    let state = 'PLAY';
    let moveLeft = false, moveRight = false;

    function initWave(w) {
      wave = w;
      document.getElementById('wave').innerText = wave;
      aliens = [];
      alienSpeed = 1.0 + wave * 0.25;
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 8; c++) {
          aliens.push({
            x: 40 + c * 40,
            y: 40 + r * 32,
            w: 24, h: 20,
            color: r === 0 ? '#ef4444' : r === 1 ? '#eab308' : '#38bdf8',
            points: (4 - r) * 10
          });
        }
      }
      bullets = [];
      alienBullets = [];
      state = 'PLAY';
      playSound('pop');
    }
    function shoot() {
      if (state !== 'PLAY') return;
      if (bullets.length < 3) {
        bullets.push({ x: player.x + player.w / 2, y: player.y, speed: 8 });
        playSound('shoot');
      }
    }
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = true;
      if (e.key === 'ArrowRight' || e.key === 'd') moveRight = true;
      if (e.code === 'Space') { e.preventDefault(); shoot(); }
      if (state === 'DEAD' && e.code === 'Enter') resetAll();
    });
    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a') moveLeft = false;
      if (e.key === 'ArrowRight' || e.key === 'd') moveRight = false;
    });

    document.getElementById('b-left').addEventListener('pointerdown', (e) => { e.preventDefault(); moveLeft = true; });
    document.getElementById('b-left').addEventListener('pointerup', () => moveLeft = false);
    document.getElementById('b-right').addEventListener('pointerdown', (e) => { e.preventDefault(); moveRight = true; });
    document.getElementById('b-right').addEventListener('pointerup', () => moveRight = false);
    document.getElementById('b-fire').addEventListener('pointerdown', (e) => { e.preventDefault(); shoot(); });

    function resetAll() {
      lives = 3; score = 0;
      document.getElementById('score').innerText = '0';
      document.getElementById('lives').innerText = '❤️❤️❤️';
      initWave(1);
    }

    function update() {
      if (state !== 'PLAY') return;
      if (moveLeft) player.x = Math.max(10, player.x - 5);
      if (moveRight) player.x = Math.min(400 - player.w - 10, player.x + 5);

      // Player bullets
      bullets.forEach(b => b.y -= b.speed);
      bullets = bullets.filter(b => b.y > 0);

      // Alien Movement
      let hitEdge = false;
      aliens.forEach(a => {
        a.x += alienDir * alienSpeed;
        if (a.x < 10 || a.x + a.w > 390) hitEdge = true;
      });
      if (hitEdge) {
        alienDir *= -1;
        aliens.forEach(a => {
          a.y += 12;
          if (a.y + a.h >= player.y) die();
        });
      }

      // Alien shooting
      if (Math.random() < 0.03 && aliens.length > 0) {
        const shooter = aliens[Math.floor(Math.random() * aliens.length)];
        alienBullets.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h, speed: 4 });
      }
      alienBullets.forEach(ab => {
        ab.y += ab.speed;
        if (ab.x > player.x && ab.x < player.x + player.w && ab.y > player.y && ab.y < player.y + player.h) {
          lives--;
          document.getElementById('lives').innerText = '❤️'.repeat(Math.max(0, lives));
          playSound('hit');
          alienBullets = [];
          if (lives <= 0) die();
        }
      });
      alienBullets = alienBullets.filter(ab => ab.y < 500);

      // Bullet - Alien Collisions
      bullets.forEach((b, bIdx) => {
        aliens.forEach((a, aIdx) => {
          if (b.x > a.x && b.x < a.x + a.w && b.y > a.y && b.y < a.y + a.h) {
            score += a.points;
            document.getElementById('score').innerText = score;
            bullets.splice(bIdx, 1);
            aliens.splice(aIdx, 1);
            playSound('score');
            if (aliens.length === 0) {
              playSound('win');
              setTimeout(() => initWave(wave + 1), 800);
            }
          }
        });
      });
    }
    function die() {
      state = 'DEAD';
      playSound('hit');
    }

    function draw() {
      ctx.clearRect(0, 0, 400, 500);
      // Stars
      ctx.fillStyle = '#ffffff22';
      for (let i = 0; i < 25; i++) {
        ctx.fillRect((i * 41) % 400, (i * 73) % 500, 2, 2);
      }

      // Draw Player Cannon
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(player.x, player.y + 6, player.w, 10);
      ctx.fillRect(player.x + 11, player.y, 8, 8);

      // Draw Bullets
      ctx.fillStyle = '#00ffcc';
      bullets.forEach(b => ctx.fillRect(b.x - 1.5, b.y, 3, 10));

      ctx.fillStyle = '#f43f5e';
      alienBullets.forEach(ab => ctx.fillRect(ab.x - 2, ab.y, 4, 8));

      // Draw Aliens
      aliens.forEach(a => {
        ctx.fillStyle = a.color;
        ctx.fillRect(a.x + 4, a.y, a.w - 8, a.h);
        ctx.fillRect(a.x, a.y + 4, a.w, a.h - 8);
        // Eyes
        ctx.fillStyle = '#000';
        ctx.fillRect(a.x + 5, a.y + 6, 3, 4);
        ctx.fillRect(a.x + a.w - 8, a.y + 6, 3, 4);
      });

      if (state === 'DEAD') {
        ctx.fillStyle = '#ff3366';
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('EARTH INVADED! GAME OVER', 200, 250);
        ctx.font = '14px monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText('Press Enter or Tap to Restart', 200, 280);
      }
    }
    canvas.addEventListener('pointerdown', () => { if (state === 'DEAD') resetAll(); });

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }
    resetAll();
    loop();
  </script>
</body>
</html>
