<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fishing Mini Game - Clay Edition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body {
      background: linear-gradient(135deg, #e4edf8 0%, #d8e5f5 100%);
      font-family: 'Fredoka', cursive, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #2c3e50;
      padding: 12px;
    }
    #game-container {
      position: relative;
      width: 480px;
      max-width: 96vw;
      height: 720px;
      max-height: 94vh;
      background: #fbfdff;
      border-radius: 36px;
      box-shadow: 18px 24px 45px rgba(160, 180, 205, 0.45), -12px -12px 35px #ffffff,
                  inset 4px 4px 8px rgba(255, 255, 255, 0.9), inset -4px -4px 8px rgba(160, 180, 205, 0.2);
      overflow: hidden;
      border: 4px solid #ffffff;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .clay-pill {
      background: #ffffff;
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 6px 8px 16px rgba(166, 180, 200, 0.45), inset 3px 3px 6px #ffffff, inset -3px -3px 6px rgba(166, 180, 200, 0.3);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 700;
      pointer-events: auto;
    }
    /* Reel Tension Meter */
    #reel-meter-wrap {
      position: absolute;
      right: 24px;
      top: 120px;
      bottom: 120px;
      width: 42px;
      background: #eef2f7;
      border-radius: 22px;
      box-shadow: inset 3px 3px 6px rgba(160, 180, 205, 0.4), inset -3px -3px 6px #ffffff;
      border: 3px solid #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      padding: 4px;
      z-index: 10;
    }
    #reel-bar {
      width: 100%;
      height: 35%;
      background: #2ecc71;
      border-radius: 16px;
      box-shadow: 2px 3px 6px rgba(0, 0, 0, 0.2), inset 2px 2px 4px #ffffff;
      position: relative;
    }
    #fish-target {
      position: absolute;
      width: 28px;
      height: 28px;
      font-size: 20px;
      left: 3px;
      transition: bottom 0.1s ease-out;
    }
    /* Modal */
    .screen-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(240, 246, 255, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 20;
      text-align: center;
    }
    .screen-modal.hidden { display: none; }
    .clay-card {
      background: #ffffff;
      padding: 28px 24px;
      border-radius: 32px;
      box-shadow: 14px 20px 35px rgba(160, 178, 202, 0.4), inset 4px 4px 8px #ffffff;
      border: 3px solid #ffffff;
      width: 100%;
      max-width: 340px;
    }
    .clay-btn {
      background: linear-gradient(135deg, #0984e3 0%, #74b9ff 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 6px 10px 18px rgba(9, 132, 227, 0.35), inset 2px 2px 4px #ffffff;
      cursor: pointer;
      margin-top: 18px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="canvas" width="480" height="720"></canvas>

    <div class="hud">
      <div class="clay-pill">
        <span>🪣</span>
        <span id="catch-val">0 Fishes</span>
      </div>
      <button class="clay-pill" id="btn-sound" style="padding: 8px 12px; cursor: pointer;">🔊</button>
    </div>

    <!-- Tension Reel Meter (shown during reeling) -->
    <div id="reel-meter-wrap" style="display: none;">
      <div id="fish-target" style="bottom: 50%;">🐟</div>
      <div id="reel-bar" style="bottom: 0%;"></div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen-modal">
      <div class="clay-card">
        <div style="font-size: 52px; margin-bottom: 8px;">🎣 🐟 🌊</div>
        <h1 style="color: #0984e3; font-size: 28px;">Clay Fishing</h1>
        <p style="color: #636e72; font-size: 15px; margin: 10px 0;">Tap to cast into the water! When a fish bites, hold to reel and keep the bar aligned!</p>
        <button id="btn-start" class="clay-btn">CAST ROD ▶</button>
      </div>
    </div>

    <!-- Catch Popup Modal -->
    <div id="catch-modal" class="screen-modal hidden">
      <div class="clay-card">
        <div style="font-size: 54px; margin-bottom: 8px;" id="catch-emoji">🐠</div>
        <h1 style="color: #00cec9; font-size: 26px;" id="catch-name">CLOWNFISH CAUGHT!</h1>
        <p style="color: #636e72; font-size: 15px; margin: 10px 0;">Added to your clay bucket!</p>
        <button id="btn-next-cast" class="clay-btn">CAST AGAIN 🎣</button>
      </div>
    </div>
  </div>

  <script>
    class ClaySound {
      constructor() {
        this.ctx = null;
        this.muted = false;
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        } catch (e) {}
      }
      resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }
      toggle() { this.muted = !this.muted; return this.muted; }
      splash() {
        if (!this.ctx || this.muted) return;
        this.resume();
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(400, this.ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.12);
        g.gain.setValueAtTime(0.3, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + 0.14);
      }
      catchFish() {
        if (!this.ctx || this.muted) return;
        this.resume();
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = 'triangle';
          o.frequency.value = f;
          g.gain.setValueAtTime(0.25, now + idx * 0.06);
          g.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.06 + 0.15);
          o.connect(g); g.connect(this.ctx.destination);
          o.start(now + idx * 0.06); o.stop(now + idx * 0.06 + 0.16);
        });
      }
    }
    const sound = new ClaySound();

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = 480;
    const H = 720;

    let caughtCount = 0;
    // States: 'IDLE', 'CAST', 'WAITING', 'BITING', 'REELING'
    let state = 'IDLE';

    let bobber = { x: 240, y: 460, dip: 0 };
    let biteTimer = 0;

    // Reeling mechanics
    let barPos = 20; // 0 to 65%
    let fishPos = 50; // 0 to 100%
    let fishTargetPos = 50;
    let progress = 30; // 0 to 100%
    let isHoldingReel = false;

    const FISH_TYPES = [
      { name: 'Red Snapper', emoji: '🐟' },
      { name: 'Tropical Clownfish', emoji: '🐠' },
      { name: 'Blue Tang', emoji: '🐡' },
      { name: 'Golden Koi', emoji: '✨' }
    ];

    function startCast() {
      state = 'WAITING';
      bobber = { x: 200 + Math.random() * 80, y: 420 + Math.random() * 80, dip: 0 };
      biteTimer = 100 + Math.floor(Math.random() * 120);
      sound.splash();
    }

    function hookFish() {
      state = 'REELING';
      document.getElementById('reel-meter-wrap').style.display = 'flex';
      barPos = 20;
      fishPos = 50;
      progress = 35;
    }

    function checkCatchSuccess() {
      document.getElementById('reel-meter-wrap').style.display = 'none';
      caughtCount++;
      sound.catchFish();
      document.getElementById('catch-val').innerText = `${caughtCount} Fishes`;

      const fish = FISH_TYPES[Math.floor(Math.random() * FISH_TYPES.length)];
      document.getElementById('catch-emoji').innerText = fish.emoji;
      document.getElementById('catch-name').innerText = `${fish.name.toUpperCase()}!`;
      document.getElementById('catch-modal').classList.remove('hidden');
      state = 'IDLE';
    }

    // Touch / Mouse Reel holding
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      if (state === 'IDLE') startCast();
      else if (state === 'BITING') hookFish();
      else if (state === 'REELING') isHoldingReel = true;
    });

    window.addEventListener('pointerup', () => { isHoldingReel = false; });

    document.getElementById('btn-start').addEventListener('click', () => {
      document.getElementById('start-screen').classList.add('hidden');
      startCast();
    });
    document.getElementById('btn-next-cast').addEventListener('click', () => {
      document.getElementById('catch-modal').classList.add('hidden');
      startCast();
    });
    document.getElementById('btn-sound').addEventListener('click', () => {
      const m = sound.toggle();
      document.getElementById('btn-sound').innerText = m ? '🔇' : '🔊';
    });

    function loop() {
      // Draw Sky & Clay Lake Surface
      ctx.fillStyle = '#74b9ff';
      ctx.fillRect(0, 0, W, H * 0.35);

      ctx.fillStyle = '#0984e3';
      ctx.beginPath();
      ctx.roundRect(0, H * 0.35, W, H * 0.65, 0);
      ctx.fill();

      // Water Ripple Waves
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      ctx.lineWidth = 3;
      for (let i = 0; i < 4; i++) {
        const ry = H * 0.4 + i * 70;
        ctx.beginPath();
        ctx.arc(W / 2, ry, 120 + i * 20, 0, Math.PI);
        ctx.stroke();
      }

      // Draw Fishing Rod
      ctx.strokeStyle = '#e17055';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(30, H - 40);
      ctx.lineTo(120, 180);
      ctx.stroke();

      // Fishing line to bobber
      if (state !== 'IDLE') {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(120, 180);
        ctx.lineTo(bobber.x, bobber.y + bobber.dip);
        ctx.stroke();

        // Draw Clay Bobber
        ctx.save();
        ctx.translate(bobber.x, bobber.y + bobber.dip);
        ctx.fillStyle = '#ff7675';
        ctx.beginPath();
        ctx.arc(0, -6, 10, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 6, 10, 0, Math.PI);
        ctx.fill();
        ctx.restore();
      }

      // State machine logic
      if (state === 'WAITING') {
        biteTimer--;
        if (biteTimer <= 0) {
          state = 'BITING';
          biteTimer = 65; // Time window to tap
        }
      } else if (state === 'BITING') {
        bobber.dip = Math.sin(Date.now() * 0.03) * 8;
        ctx.fillStyle = '#f1c40f';
        ctx.font = 'bold 24px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('BITE! 🐟 TAP!', bobber.x, bobber.y - 30);

        biteTimer--;
        if (biteTimer <= 0) {
          // Escaped
          state = 'IDLE';
          startCast();
        }
      } else if (state === 'REELING') {
        // Move target fish erratically
        if (Math.random() < 0.05) fishTargetPos = 10 + Math.random() * 80;
        fishPos += (fishTargetPos - fishPos) * 0.08;

        // Player reel bar
        if (isHoldingReel) barPos = Math.min(65, barPos + 1.6);
        else barPos = Math.max(0, barPos - 1.2);

        // Check if fish is inside bar range
        const inZone = (fishPos >= barPos && fishPos <= barPos + 35);
        if (inZone) progress += 0.45;
        else progress -= 0.35;

        // Update DOM
        document.getElementById('reel-bar').style.bottom = `${barPos}%`;
        document.getElementById('fish-target').style.bottom = `${fishPos}%`;

        if (progress >= 100) checkCatchSuccess();
        else if (progress <= 0) {
          // Fish escaped
          document.getElementById('reel-meter-wrap').style.display = 'none';
          state = 'IDLE';
        }
      }

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
